# On a v* tag: test, cross-compile every target, build the JetBrains IDE plugin zip
# (with those binaries in its bin/) and publish them all as a GitHub Release.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: go vet ./...
      - run: make test
      - run: make build-all
      - name: Build IDE plugin
        working-directory: idea-plugin
        run: ./gradlew buildPlugin --no-daemon
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes \
            dist/dashboard-mac-darwin dist/dashboard-lin-x64 dist/dashboard-lin-arm64 dist/dashboard.exe \
            idea-plugin/build/distributions/ai-sessions-dashboard-*.zip
