# Plugin version: also the <version> written into plugin.xml. Keep in step with
# Version in ../src/dashboard/run.go.
pluginVersion=3.2.4
# Oldest IDE build the plugin supports (2023.3); no upper bound.
pluginSinceBuild=233
# IDE the plugin is compiled and verified against (the original 3.1.1 was built on GoLand 2026.3).
platformType=GO
platformVersion=2026.3
# Folder with the dashboard binaries from `make build-all`.
dashboardDist=../dist

org.gradle.configuration-cache=true
org.gradle.caching=true
kotlin.stdlib.default.dependency=false
