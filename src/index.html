<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>OpenCode Token Usage</title>
    <style>
        :root {
            --bg: #14161a;
            --fg: #e6e6e6;
            --dim: #8a8f98;
            --line: #2a2d33;
            --acc: #7aa2f7;
            --user: #9ece6a;
            --sub: #e0af68
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font: 14px/1.45 -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--fg);
            height: 100vh;
            display: flex;
            flex-direction: column
        }

        header {
            position: sticky;
            top: 0;
            background: var(--bg);
            border-bottom: 1px solid var(--line);
            padding: 10px 18px;
            display: flex;
            gap: 16px;
            align-items: flex-start;
            z-index: 5
        }

        .hgrp {
            display: flex;
            gap: 16px;
            align-items: center;
            min-width: 0
        }

        .hgrp.center {
            margin: 0 auto;
            flex-wrap: wrap
        }

        .hgrp.right {
            margin-left: auto;
            flex: none
        }

        header h1 {
            font-size: 15px;
            margin: 0;
            font-weight: 600;
            line-height: 29px
        }

        #provsel {
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            background: transparent;
            color: inherit;
            border: 1px solid transparent;
            border-radius: 6px;
            padding: 1px 2px;
            cursor: pointer
        }

        #provsel:hover,
        #provsel:focus {
            border-color: var(--line);
            background: var(--bg)
        }

        .ver {
            border-left: 1px solid var(--line);
            padding-left: 16px;
            font-size: 12px;
            color: var(--dim);
            font-variant-numeric: tabular-nums
        }

        .headcol {
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: flex-start;
            flex: none
        }
        .dbwrap {
            display: inline-flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap
        }

        .dblabel {
            color: var(--dim);
            font-size: 12px
        }

        #dbsel {
            background: #1d2026;
            color: var(--fg);
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 3px 8px;
            font: inherit;
            font-size: 12px;
            max-width: 280px
        }

        #dbsel option {
            background: #1d2026
        }

        .dbcustom {
            background: #1d2026;
            color: var(--fg);
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 3px 8px;
            font: inherit;
            font-size: 12px;
            width: 300px
        }

        .dbwrap.missing #dbsel,
        .dbwrap.missing .dbcustom {
            border-color: #f7768e;
            box-shadow: 0 0 0 1px #f7768e
        }

        .fbtn {
            background: #1d2026;
            border: 1px solid var(--line);
            color: var(--fg);
            border-radius: 6px;
            padding: 4px 12px;
            cursor: pointer;
            font: inherit;
            font-size: 13px;
            font-weight: 600
        }

        .fbtn:hover {
            border-color: var(--acc)
        }

        .fbtn.on {
            background: var(--acc);
            border-color: var(--acc);
            color: #1a1a1a
        }

        .fbtn.on:hover {
            background: #8db1ff
        }

        .rbtn {
            background: #1d2026;
            border: 1px solid var(--line);
            color: var(--dim);
            border-radius: 6px;
            padding: 3px 10px;
            display: inline-flex;
            gap: 6px;
            align-items: center;
            cursor: pointer;
            font: inherit;
            font-size: 13px;
            font-variant-numeric: tabular-nums;
            user-select: none
        }

        .ricon {
            width: 13px;
            height: 13px;
            display: block
        }

        .rbtn:hover {
            color: var(--fg);
            border-color: var(--acc)
        }

        .rbtn.busy {
            color: var(--acc);
            border-color: var(--acc)
        }

        .langsw {
            display: inline-flex;
            border: 1px solid var(--line);
            border-radius: 6px;
            overflow: hidden;
            user-select: none;
            font-size: 12px
        }

        .langsw span {
            padding: 3px 8px;
            cursor: pointer;
            color: var(--dim);
            background: #1d2026
        }

        .langsw span:hover {
            color: var(--fg)
        }

        .langsw span.on {
            color: var(--acc);
            background: #232730;
            font-weight: 600
        }

        .hlbox {
            display: flex;
            gap: 6px;
            align-items: center;
            color: var(--dim);
            font-size: 13px;
            cursor: default
        }

        .hlbox input[type=number] {
            background: #1d2026;
            border: 1px solid var(--line);
            color: var(--fg);
            border-radius: 6px;
            padding: 4px 7px;
            width: 64px;
            font: inherit;
            font-size: 13px
        }

        .hlbox input[type=number]:focus {
            outline: none;
            border-color: var(--acc)
        }

        .hlbox input[type=checkbox] {
            accent-color: var(--acc);
            cursor: pointer
        }

        .node.warn {
            background: rgba(230, 200, 80, .16)
        }

        .node.warn:hover {
            background: rgba(230, 200, 80, .28)
        }

        .node.crit {
            background: rgba(247, 118, 142, .16)
        }

        .node.crit:hover {
            background: rgba(247, 118, 142, .28)
        }

        .node.sel {
            box-shadow: inset 0 0 0 2px var(--acc)
        }

        .node.sel:not(.warn):not(.crit) {
            background: rgba(122, 162, 247, .12)
        }

        table.calls tbody tr.warn {
            background: rgba(230, 200, 80, .16)
        }

        table.calls tbody tr.warn:hover {
            background: rgba(230, 200, 80, .28)
        }

        table.calls tbody tr.crit {
            background: rgba(247, 118, 142, .16)
        }

        table.calls tbody tr.crit:hover {
            background: rgba(247, 118, 142, .28)
        }

        table.calls tbody tr.hum td {
            background: rgba(124, 200, 100, .32);
            box-shadow: inset 0 1px 0 rgba(124, 200, 100, .55), inset 0 -1px 0 rgba(124, 200, 100, .55)
        }

        table.calls tbody tr.hum:hover td {
            background: rgba(124, 200, 100, .45)
        }

        table.calls tbody tr.hum td:first-child {
            border-radius: 8px 0 0 8px;
            box-shadow: inset 1px 0 0 rgba(124, 200, 100, .55), inset 0 1px 0 rgba(124, 200, 100, .55), inset 0 -1px 0 rgba(124, 200, 100, .55)
        }

        table.calls tbody tr.hum td:last-child {
            border-radius: 0 8px 8px 0;
            box-shadow: inset -1px 0 0 rgba(124, 200, 100, .55), inset 0 1px 0 rgba(124, 200, 100, .55), inset 0 -1px 0 rgba(124, 200, 100, .55)
        }

        .human-ic {
            margin-right: 4px
        }

        main {
            display: flex;
            flex: 1;
            min-height: 0
        }

        #tree {
            flex: 1;
            overflow: auto;
            padding: 0 18px 12px
        }

        #splitter {
            flex: 0 0 5px;
            cursor: col-resize;
            background: var(--line);
            transition: background .15s
        }

        #splitter:hover, #splitter.active {
            background: var(--acc)
        }

        #detail {
            width: 44%;
            min-width: 300px;
            border-left: 1px solid var(--line);
            overflow: auto;
            padding: 16px 20px
        }

        ul, li {
            list-style: none;
            margin: 0;
            padding: 0
        }

        li li > .node {
            padding-left: 56px
        }

        li li li > .node {
            padding-left: 112px
        }

        li li li li > .node {
            padding-left: 168px
        }

        .node {
            position: relative;
            display: flex;
            gap: 10px;
            align-items: baseline;
            padding: 4px 6px;
            border-radius: 6px;
            cursor: pointer;
            flex-wrap: wrap;
            margin-bottom: 1px
        }

        .node:hover {
            background: #1d2026
        }

        .hcol {
            width: 68px;
            text-align: center;
            flex: none
        }

        .ecg {
            width: 68px;
            height: 20px;
            flex: none;
            overflow: visible
        }

        .ecg.lg {
            height: 30px
        }

        .ecg.xl {
            height: 40px
        }

        .ecg polyline {
            fill: none;
            stroke: #e5484d;
            stroke-width: 1.3
        }

        .hlbox .ecg {
            width: 22px;
            height: 13px;
            flex: none
        }

        .node .ttl {
            flex: 1;
            min-width: 180px;
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }

        .node.root > .ttl {
            font-weight: 700
        }

        .badge {
            font-size: 11px;
            padding: 1px 7px;
            border-radius: 10px;
            background: #232730;
            color: var(--dim);
            white-space: nowrap
        }

        .badge.agent {
            color: var(--user)
        }

        .badge.sub {
            color: var(--sub)
        }

        .num {
            font-variant-numeric: tabular-nums;
            font-size: 12px;
            color: var(--dim);
            white-space: nowrap
        }

        #summary {
            white-space: nowrap
        }

        .num b {
            color: var(--fg)
        }

        .num b.ctxsize {
            color: #1a1a1a
        }

        .vals {
            display: inline-flex;
            gap: 8px;
            flex: none;
            align-items: baseline
        }

        .val {
            display: inline-block;
            width: 5ch;
            text-align: right;
            font-size: 12px;
            color: var(--dim);
            font-variant-numeric: tabular-nums;
            white-space: nowrap
        }

        .val b {
            color: var(--fg)
        }

        .v-idx {
            width: 3.5ch
        }

        .v-ctx {
            width: 6ch
        }

        .v-tok {
            width: 5.5ch
        }

        .vbar {
            display: inline-block;
            width: 20px;
            height: 5px;
            border-radius: 3px;
            background: #232730;
            vertical-align: middle;
            overflow: hidden;
            flex: none
        }

        .vbar span {
            display: block;
            height: 100%;
            border-radius: 3px;
            background: var(--acc)
        }

        .vbar.amber span {
            background: var(--sub)
        }

        .thead {
            position: sticky;
            top: 0;
            z-index: 2;
            background: #262b36;
            display: flex;
            gap: 10px;
            align-items: baseline;
            padding: 7px 4px;
            margin-bottom: 6px;
            border: 2px solid #3d4455;
            box-shadow: 0 4px 8px rgba(0, 0, 0, .35)
        }

        .thead .grow {
            flex: 1
        }

        .hlead {
            width: 14px;
            flex: none
        }

        .thc, .thl {
            font-size: 13px;
            font-weight: 700;
            color: var(--fg);
            white-space: nowrap
        }

        .hsp {
            width: 20px;
            flex: none
        }

        .th {
            cursor: pointer;
            overflow: visible
        }

        .th:hover .thl {
            color: var(--acc)
        }

        .th.active, .th.active .thl {
            color: var(--acc);
            position: relative
        }

        .th.active::after {
            content: '▾';
            position: absolute;
            right: 100%;
            margin-right: 3px
        }

        .th.active.asc::after {
            content: '▴'
        }

        .caret {
            cursor: pointer;
            color: var(--dim);
            width: 14px;
            display: inline-block;
            user-select: none
        }

        .project {
            color: var(--dim);
            font-size: 12px;
            padding: 10px 0 2px 6px;
            letter-spacing: .3px
        }

        #detail h2 {
            font-size: 15px;
            margin: 0 0 8px
        }

        #detail .meta {
            background: #1a1d22;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 13px;
            margin-bottom: 14px
        }

        #detail .meta dl {
            display: grid;
            grid-template-columns:auto 1fr;
            gap: 4px 14px;
            margin: 0
        }

        #detail .meta dt {
            color: var(--dim)
        }

        #detail .meta dd {
            margin: 0;
            font-variant-numeric: tabular-nums;
            overflow-wrap: anywhere
        }

        table.tokgrid {
            border-collapse: collapse;
            margin-top: 10px;
            width: 100%;
            font-variant-numeric: tabular-nums
        }

        table.tokgrid th, table.tokgrid td {
            padding: 3px 8px;
            text-align: right;
            border-top: 1px solid var(--line)
        }

        table.tokgrid thead th {
            color: var(--dim);
            font-weight: 500;
            font-size: 12px;
            border-top: none
        }

        table.tokgrid tbody th {
            text-align: left;
            font-weight: 500;
            color: var(--dim);
            padding-left: 0;
            white-space: nowrap
        }

        table.tokgrid .sep {
            border-left: 1px solid var(--line)
        }

        table.tokgrid tr.own td:nth-of-type(1) {
            color: var(--acc)
        }

        table.tokgrid tr.kids td:nth-of-type(1) {
            color: var(--sub)
        }

        table.tokgrid tr.total td {
            font-weight: 700
        }

        pre.prompt {
            white-space: pre-wrap;
            word-break: break-word;
            background: #1a1d22;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 12px;
            font-size: 12.5px;
            max-height: 38vh;
            overflow: auto
        }

        .sect {
            color: var(--dim);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: .5px;
            margin: 14px 0 6px
        }

        .empty {
            color: var(--dim);
            padding: 30px;
            text-align: center
        }

        .own {
            color: var(--acc)
        }

        .kids {
            color: var(--sub)
        }

        table.calls {
            border-collapse: separate;
            border-spacing: 0;
            width: 100%;
            font-size: 12px;
            font-variant-numeric: tabular-nums
        }

        table.calls th {
            text-align: left;
            color: var(--dim);
            font-weight: 500;
            padding: 3px 6px;
            border-bottom: 1px solid var(--line)
        }

        table.calls td {
            padding: 3px 6px;
            border-bottom: 1px solid #1f2229
        }

        table.calls tfoot td {
            border-top: 1px solid var(--line);
            border-bottom: none;
            color: var(--fg)
        }

        .ctxsize {
            background: #ffd43b;
            color: #1a1a1a;
            font-weight: 700;
            padding: 0 5px;
            border-radius: 4px
        }

        table.calls .vbar {
            margin-right: 6px
        }

        table.calls tbody tr {
            cursor: pointer
        }

        table.calls tbody tr:hover {
            background: #1d2026
        }

        table.calls .sep {
            border-left: 1px solid var(--line);
            padding-left: 10px
        }

        #modal {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center
        }

        #modal[hidden] {
            display: none
        }

        #modal-bg {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, .55)
        }

        #modal-box {
            position: relative;
            background: var(--bg);
            border: 1px solid var(--line);
            border-radius: 10px;
            width: min(860px, 92vw);
            height: min(760px, 86vh);
            display: flex;
            flex-direction: column
        }

        .cnav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 40px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            color: #4a2f00;
            background: #f8c471;
            border: 1px solid #d99a3d;
            border-radius: 8px;
            cursor: pointer;
            user-select: none;
            font-weight: 700
        }

        .cnav:hover {
            background: #f5ae4a
        }

        .cnav.disabled {
            opacity: .25;
            cursor: default
        }

        .cnav.prev {
            left: -52px
        }

        .cnav.next {
            right: -52px
        }

        #modal-head {
            padding: 10px 16px;
            border-bottom: 1px solid var(--line);
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px;
            font-size: 13px;
            background: #a9c7f2;
            color: #14213d;
            border-radius: 9px 9px 0 0
        }

        #modal-head .num {
            color: #41557a
        }

        #modal-close {
            cursor: pointer;
            color: #41557a;
            border: none;
            background: none;
            font-size: 16px;
            padding: 2px 6px
        }

        #modal-close:hover {
            color: #14213d
        }

        #modal-body {
            padding: 12px 16px;
            overflow: auto
        }

        .tblock {
            margin: 10px 0
        }

        .tblock .lbl {
            color: var(--dim);
            font-size: 12px;
            margin-bottom: 4px
        }

        .tblock pre.prompt {
            max-height: 40vh
        }

        #fmodal {
            position: fixed;
            inset: 0;
            z-index: 12;
            display: flex;
            align-items: center;
            justify-content: center
        }

        #fmodal[hidden] {
            display: none
        }

        #fmodal-bg {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, .55)
        }

        #fmodal-box {
            position: relative;
            background: var(--bg);
            border: 1px solid var(--line);
            border-radius: 10px;
            width: min(430px, 92vw);
            max-height: 86vh;
            display: flex;
            flex-direction: column
        }

        #fmodal-head {
            padding: 10px 14px;
            border-bottom: 1px solid var(--line);
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px;
            font-size: 13px;
            font-weight: 600
        }

        #fmodal-body {
            padding: 6px 14px 14px;
            overflow: auto
        }

        .xbtn {
            cursor: pointer;
            color: var(--dim);
            border: none;
            background: none;
            font-size: 16px;
            padding: 2px 6px;
            font-weight: 400
        }

        .xbtn:hover {
            color: var(--fg)
        }

        .fsect {
            color: var(--dim);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .5px;
            margin: 12px 0 5px;
            display: flex;
            align-items: center
        }

        .cktogs {
            margin-left: auto;
            display: inline-flex;
            gap: 4px
        }

        .cktog {
            background: none;
            border: 1px solid var(--line);
            color: var(--dim);
            border-radius: 4px;
            padding: 0 7px;
            cursor: pointer;
            font: inherit;
            font-size: 11px;
            text-transform: none;
            letter-spacing: 0
        }

        .cktog:hover {
            color: var(--fg);
            border-color: var(--acc)
        }

        .fcount {
            margin-left: auto;
            color: var(--dim);
            font-weight: 400;
            font-size: 12px;
            font-variant-numeric: tabular-nums
        }

        .frow {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 7px 0;
            font-size: 13px
        }

        .flbl {
            width: 112px;
            flex: none;
            color: var(--dim)
        }

        .finputs {
            display: inline-flex;
            gap: 6px;
            align-items: center;
            flex: 1
        }

        .finputs input {
            background: #1d2026;
            border: 1px solid var(--line);
            color: var(--fg);
            border-radius: 6px;
            padding: 4px 8px;
            width: 90px;
            font: inherit;
            font-size: 13px
        }

        .finputs input:focus {
            outline: none;
            border-color: var(--acc)
        }

        .finputs input.h {
            width: 54px
        }

        .finputs input[type=date] {
            width: 128px
        }

        #ft-drow .finputs {
            flex-wrap: wrap
        }

        .cklist {
            max-height: 132px;
            overflow: auto;
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 6px 9px;
            display: flex;
            flex-direction: column;
            gap: 4px
        }

        .cklist label {
            display: flex;
            gap: 7px;
            align-items: center;
            font-size: 13px;
            cursor: pointer
        }

        .dateopts {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 12px;
            flex: 1
        }

        .dateopt {
            display: inline-flex;
            gap: 5px;
            align-items: center;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap
        }

        .dateopt input {
            accent-color: var(--acc)
        }

        .cklist input {
            accent-color: var(--acc)
        }

        .freset {
            margin-top: 12px;
            background: none;
            border: 1px solid var(--line);
            color: var(--dim);
            border-radius: 6px;
            padding: 4px 12px;
            cursor: pointer;
            font: inherit;
            font-size: 13px
        }

        .freset:hover {
            color: var(--fg)
        }

        .sect .fbtn {
            margin-left: 10px;
            padding: 1px 9px;
            font-size: 11px;
            border-radius: 5px;
            vertical-align: 1px
        }

        @media (max-width: 900px) {
            .cnav.prev {
                left: 6px
            }

            .cnav.next {
                right: 6px
            }

            main {
                flex-direction: column
            }

            #splitter {
                display: none
            }

            #detail {
                width: 100%;
                min-width: 0;
                border-left: none;
                border-top: 1px solid var(--line);
                height: 45%
            }
        }
    </style>
</head>
<body>
<header><div class="headcol" id="grp-src"><h1 id="apptitle"><select id="provsel" title="data source"></select></h1><span id="dbwrap" class="dbwrap"><span id="dblabel" class="dblabel">database</span><select id="dbsel"></select><input type="text" id="dbcustom" class="dbcustom" hidden><button class="fbtn" id="dbapply" hidden></button></span></div>
    <div class="hgrp center" id="grp-filter"><button class="fbtn" id="tree-fbtn" onclick="openTreeFilter()" title="session filter">Filter</button>
    <label class="hlbox" id="hlbox" title="rows with context above these values (in k tokens) are highlighted: warn — yellow, crit — red"><span id="hllabel">ctx highlight warn/crit, k</span><input type="number" id="hlwarn" value="100" min="0" title="warning threshold: rows with context above this value (in k tokens) are highlighted yellow"><input type="number" id="hlcrit" value="120" min="0" title="critical threshold: rows with context above this value (in k tokens) are highlighted red"><input type="checkbox" id="hlapply" title="Keep in the tree only the sessions whose context exceeds the warn or crit threshold (plus the parent chain leading to them). The AI calls list is never filtered by this — it only gets the highlight."><span id="hlapplylabel" title="Keep in the tree only the sessions whose context exceeds the warn or crit threshold (plus the parent chain leading to them). The AI calls list is never filtered by this — it only gets the highlight.">apply threshold</span></label>
    <label class="hlbox" id="recbox" title="Keep in the tree only the sessions updated within the last 15 min, plus the parent chain leading to them. The AI calls list is never filtered by this."><input type="checkbox" id="reconly" title="Keep in the tree only the sessions updated within the last 15 min, plus the parent chain leading to them. The AI calls list is never filtered by this."><svg class="ecg" viewBox="0 0 34 20" aria-hidden="true"><polyline points="0,10 10,10 12,12 14,2 16,14 18,10 34,10"/></svg><span id="reclabel" title="Keep in the tree only the sessions updated within the last 15 min, plus the parent chain leading to them. The AI calls list is never filtered by this.">recent sessions only</span></label>
    <span id="summary" class="num"></span></div>
    <div class="hgrp right" id="grp-meta"><span id="version" class="ver" title="dashboard version">v{{VERSION}}</span>
    <span id="langsw" class="langsw" title="Language"></span>
    <button class="rbtn" id="refresh" title="auto-refresh in 5s · click to refresh now"><svg class="ricon" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M13.7 1.4v3.5h-3.5z" fill="currentColor"/></svg><span id="refnum">5</span></button></div></header>
<main>
    <div id="tree"></div>
    <div id="splitter" title="Drag to resize · double-click to reset"></div>
    <div id="detail">
        <div class="empty" id="detailempty">Select a session…</div>
    </div>
</main>
<div id="modal" hidden>
    <div id="modal-bg" onclick="modalClose()"></div>
    <div id="modal-box">
        <div id="modal-head"></div>
        <div id="modal-body"></div>
        <span class="cnav prev" id="cnav-prev" onclick="callNav(-1)">‹</span>
        <span class="cnav next" id="cnav-next" onclick="callNav(1)">›</span>
    </div>
</div>
<div id="fmodal" hidden>
    <div id="fmodal-bg" onclick="fmodalClose()"></div>
    <div id="fmodal-box">
        <div id="fmodal-head"></div>
        <div id="fmodal-body"></div>
    </div>
</div>
<script src="/i18n.js"></script>
<script>
    let TREE = [], CALLS = [], VISIBLE = [], sel = null, VMAX = {ctx: 0, tok: 0},
        sortKey = null, sortAsc = false, ORDER = new Map(), COLLAPSED = new Set(), EXPANDED = new Set();
    const tr = I18N.tr;

    function computeOrder() {
        ORDER = new Map();
        [...TREE].sort((a, b) => (a.created || 0) - (b.created || 0)).forEach((r, i) => {
            ORDER.set(r.id, i + 1);
            r.order = i + 1;
        });
        (function walk(ns) {
            for (const x of ns) {
                [...x.children].sort((a, b) => (a.created || 0) - (b.created || 0))
                    .forEach((c, i) => {
                        ORDER.set(c.id, i + 1);
                        c.order = i + 1;
                    });
                walk(x.children);
            }
        })(TREE);
    }
    const fmt = n => {
        const a = Math.abs(n || 0), s = n < 0 ? '-' : '';
        return a >= 1e6 ? s + (a / 1e6).toFixed(1) + 'M' : a >= 1e3 ? s + (a / 1e3).toFixed(1) + 'k' : s + a;
    };
    const dur = ms => ms < 0 ? '—' : ms < 6e4 ? (ms / 1e3).toFixed(0) + 's' : ms < 36e5 ? (ms / 6e4).toFixed(1) + 'm' : (ms / 36e5).toFixed(1) + 'h';
    const when = t => t ? new Date(t).toLocaleString(I18N.locale()) : '—';
    // FILTER-LOGIC-START
    // Pure filter predicates — no DOM access. test/filter.test.mjs extracts exactly
    // this block and runs it in node, so keep it self-contained between the markers.
    function modelName(m) {
        return !m ? '—' : typeof m === 'object' ? (m.modelID || m.id || '—') : m;
    }

    function nodeProvider(n) {
        return n.model && typeof n.model === 'object' ? (n.model.providerID || '(none)') : '(none)';
    }

    function inRange(v, min, max) {
        return (min == null || v >= min) && (max == null || v <= max);
    }

    function hmsToMs(h, m, s) {
        if ([h, m, s].every(x => x === '' || x == null)) return null;
        const num = x => (x === '' || x == null || isNaN(Number(x))) ? 0 : Number(x);
        return (num(h) * 3600 + num(m) * 60 + num(s)) * 1000;
    }

    function kilo(k) {
        return k == null ? null : k * 1000;
    }

    function presetRange(preset, now) {
        if (preset !== 'today' && preset !== 'week' && preset !== 'month') return [null, null];
        const d = new Date(now);
        d.setHours(0, 0, 0, 0);
        if (preset === 'week') d.setDate(d.getDate() - (d.getDay() + 6) % 7);
        else if (preset === 'month') d.setDate(1);
        return [d.getTime(), null];
    }

    function dayStartMs(str) {
        if (!str) return null;
        const t = new Date(str + 'T00:00').getTime();
        return Number.isFinite(t) ? t : null;
    }

    function dateStrToRange(from, to) {
        const mn = dayStartMs(from), mx = dayStartMs(to);
        return [mn, mx == null ? null : mx + 86400000 - 1];
    }

    function resolveDateBounds(f, now) {
        if (f.datePreset === 'custom') return dateStrToRange(f.dateFrom, f.dateTo);
        return presetRange(f.datePreset, now);
    }

    function treeMatchesNode(n, f) {
        if (f.text) {
            const hay = (n.title + ' ' + n.agent + ' ' + modelName(n.model)).toLowerCase();
            if (!hay.includes(f.text.toLowerCase())) return false;
        }
        if (f.models.size && !f.models.has(modelName(n.model))) return false;
        if (f.providers.size && !f.providers.has(nodeProvider(n))) return false;
        if (!inRange(n.order || 0, f.numMin, f.numMax)) return false;
        if (!inRange(n.created || 0, f.dateMin, f.dateMax)) return false;
        if (!inRange(n.maxctx || 0, kilo(f.ctxMin), kilo(f.ctxMax))) return false;
        if (!inRange(n.subtree.in + n.subtree.out + n.subtree.reason, kilo(f.spentMin), kilo(f.spentMax))) return false;
        if (!inRange(n.dur, f.durMin, f.durMax)) return false;
        return true;
    }

    function treeVisible(n, f) {
        return treeMatchesNode(n, f) || n.children.some(c => treeVisible(c, f));
    }

    function hotLevel(v, warn, crit) {
        if (crit != null && v > crit * 1000) return 'crit';
        if (warn != null && v > warn * 1000) return 'warn';
        return '';
    }

    function treeHotVisible(n, warn, crit) {
        return !!hotLevel(n.maxctx, warn, crit) || n.children.some(c => treeHotVisible(c, warn, crit));
    }

    function treeActiveVisible(n) {
        return !!n.active || n.children.some(c => treeActiveVisible(c));
    }

    function heartSizes(roots) {
        const actives = [];
        (function walk(ns) {
            for (const n of ns) {
                if (n.active) actives.push(n);
                walk(n.children);
            }
        })(roots);
        actives.sort((a, b) => b.updated - a.updated);
        const m = new Map();
        actives.forEach((n, i) => m.set(n.id, i === 0 ? 'xl' : i === 1 ? 'lg' : ''));
        return m;
    }

    function ecgPoints(beats, now, o) {
        o = o || {};
        const w = o.w || 34, h = o.h || 20, win = o.win || 15 * 60 * 1000;
        const mid = h / 2, amp = h * 0.45, lo = now - win;
        const ts = (beats || []).filter(t => t >= lo && t <= now).sort((a, b) => a - b);
        const x = t => Math.max(0, Math.min(w, (t - lo) / win * w));
        const pts = [[0, mid]];
        for (const t of ts) {
            const cx = x(t);
            pts.push([Math.max(0, cx - 4), mid]);        // baseline before spike
            pts.push([Math.max(0, cx - 1.5), mid + h * 0.1]);  // Q dip
            pts.push([Math.max(0, cx), mid - amp]);      // R peak
            pts.push([Math.min(w, cx + 1.5), mid + h * 0.15]); // S dip
            pts.push([Math.min(w, cx + 4), mid]);        // back to baseline
        }
        pts.push([w, mid]);
        return pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
    }

    function callDeltaAt(calls, i) {
        return i ? calls[i].ctx - calls[i - 1].ctx : calls[i].ctx;
    }

    function callRowMatches(r, f) {
        if (f.text && !(r.text || '').toLowerCase().includes(f.text.toLowerCase())) return false;
        return inRange(r.n, f.numMin, f.numMax)
            && inRange(r.ctx, f.ctxMin, f.ctxMax)
            && inRange(r.delta, f.deltaMin, f.deltaMax)
            && inRange(r.out, f.outMin, f.outMax)
            && inRange(r.reason, f.reasonMin, f.reasonMax)
            && inRange(r.in, f.inMin, f.inMax)
            && inRange(r.cr, f.crMin, f.crMax);
    }

    function visibleCallRows(calls, f, textOf) {
        textOf = textOf || (c => c.time ? String(c.time) : '');
        return calls.map((c, i) => ({
            n: i + 1, mid: c.mid, time: c.time, ctx: c.ctx, delta: callDeltaAt(calls, i),
            out: c.out, reason: c.reason, in: c.in, cr: c.cr, text: textOf(c), hu: !!c.hu,
        })).filter(r => callRowMatches(r, f));
    }

    // opencode titles subagent sessions "Task (@general subagent)"; the agent
    // badge already says that, so the suffix is dropped when it names the same agent.
    function displayTitle(title, agent) {
        const t = String(title ?? '');
        if (!agent) return t;
        const m = /\s*\(@([\w.-]+) subagent\)\s*$/.exec(t);
        return m && m[1] === agent && m.index > 0 ? t.slice(0, m.index) : t;
    }

    function treeFilterCount(f) {
        const set = (a, b) => a != null || b != null;
        return [
            !!f.text, f.models.size > 0, f.providers.size > 0, set(f.numMin, f.numMax),
            f.datePreset != null && (f.datePreset !== 'custom' || !!f.dateFrom || !!f.dateTo),
            set(f.ctxMin, f.ctxMax), set(f.spentMin, f.spentMax), set(f.durMin, f.durMax)
        ].filter(Boolean).length;
    }

    function callFilterCount(f) {
        const set = (a, b) => a != null || b != null;
        return [
            !!f.text, set(f.numMin, f.numMax), set(f.ctxMin, f.ctxMax), set(f.deltaMin, f.deltaMax),
            set(f.outMin, f.outMax), set(f.reasonMin, f.reasonMax), set(f.inMin, f.inMax), set(f.crMin, f.crMax)
        ].filter(Boolean).length;
    }

    function parseHashSel(hash) {
        const m = /(?:^#|&)session=([^&]*)/.exec(hash || '');
        if (!m || !m[1]) return null;
        try { return decodeURIComponent(m[1]); } catch (e) { return null; }
    }

    if (typeof module !== 'undefined' && module.exports) module.exports = {
        modelName, nodeProvider, inRange, hmsToMs, presetRange, dateStrToRange, resolveDateBounds,
        treeMatchesNode, treeVisible, hotLevel, treeHotVisible, treeActiveVisible, heartSizes, ecgPoints,
        callDeltaAt, callRowMatches, visibleCallRows, displayTitle, treeFilterCount, callFilterCount, parseHashSel
    };
    // FILTER-LOGIC-END

    const newTreeFilter = () => ({
        text: '', models: new Set(), providers: new Set(),
        numMin: null, numMax: null,
        datePreset: null, dateFrom: null, dateTo: null, dateMin: null, dateMax: null,
        ctxMin: null, ctxMax: null, spentMin: null, spentMax: null, durMin: null, durMax: null
    });
    const newCallFilter = () => ({
        text: '', numMin: null, numMax: null, ctxMin: null, ctxMax: null, deltaMin: null, deltaMax: null,
        outMin: null, outMax: null, reasonMin: null, reasonMax: null, inMin: null, inMax: null, crMin: null, crMax: null
    });
    let treeFilter = newTreeFilter(), callFilter = newCallFilter();
    let HOT = { warn: 100, crit: 120, apply: false };
    let REC = { only: false };

    const SET_KEY = 'ttree-settings';

    function saveSettings() {
        if (typeof localStorage === 'undefined') return;
        try {
            const tree = Object.assign({}, treeFilter, {
                models: [...treeFilter.models], providers: [...treeFilter.providers]
            });
            localStorage.setItem(SET_KEY, JSON.stringify({v: 1, tree, call: callFilter, hot: HOT, rec: REC}));
        } catch (e) { /* storage unavailable — ignore */ }
    }

    function loadSettings() {
        if (typeof localStorage === 'undefined') return;
        let s;
        try { s = JSON.parse(localStorage.getItem(SET_KEY)); } catch (e) { return; }
        if (!s || s.v !== 1) return;
        try {
            if (s.tree) treeFilter = Object.assign(newTreeFilter(), s.tree,
                {models: new Set(s.tree.models || []), providers: new Set(s.tree.providers || [])});
            if (s.call) callFilter = Object.assign(newCallFilter(), s.call);
            if (s.hot) HOT = Object.assign({warn: 100, crit: 120, apply: false}, s.hot);
            if (s.rec) REC = Object.assign({only: false}, s.rec);
            document.querySelector('#hlwarn').value = HOT.warn ?? '';
            document.querySelector('#hlcrit').value = HOT.crit ?? '';
            document.querySelector('#hlapply').checked = !!HOT.apply;
            document.querySelector('#reconly').checked = !!REC.only;
        } catch (e) { /* corrupt — keep defaults */ }
    }

    function hotFilterActive() {
        return HOT.apply && (HOT.warn != null || HOT.crit != null);
    }

    function matches(s) {
        const b = resolveDateBounds(treeFilter, Date.now());
        return treeVisible(s, Object.assign({}, treeFilter, {dateMin: b[0], dateMax: b[1]}));
    }

    function treeFilterActive() {
        const f = treeFilter;
        return !!(f.text || f.models.size || f.providers.size || f.numMin != null || f.numMax != null
            || (f.datePreset != null && (f.datePreset !== 'custom' || f.dateFrom || f.dateTo))
            || f.ctxMin != null || f.ctxMax != null || f.spentMin != null || f.spentMax != null || f.durMin != null || f.durMax != null);
    }

    function callFilterActive() {
        return Object.entries(callFilter).some(([k, v]) => k === 'text' ? !!v : v != null);
    }

    function updateFilterBtns() {
        const lbl = n => tr('filter.btn') + (n ? ' · ' + n : '');
        const tb = document.querySelector('#tree-fbtn');
        const tn = treeFilterCount(treeFilter);
        tb.classList.toggle('on', tn > 0);
        tb.textContent = lbl(tn);
        const cb = document.querySelector('#call-fbtn');
        if (cb) {
            const cn = callFilterCount(callFilter);
            cb.classList.toggle('on', cn > 0);
            cb.textContent = lbl(cn);
        }
        updateFilterCount();
    }

    let SHOWN = {roots: 0, total: 0};

    function updateFilterCount() {
        const el = document.querySelector('#fcount');
        if (!el) return;
        el.textContent = fmodalKind === 'tree'
            ? tr('ftree.count', {n: SHOWN.roots, total: SHOWN.total})
            : tr('fcall.count', {n: VISIBLE.length, total: CALLS.length});
    }

    function fmodalOpen(title, bodyHtml) {
        document.querySelector('#fmodal-head').innerHTML = `<span>${title}</span><span class="fcount" id="fcount"></span><button class="xbtn" onclick="fmodalClose()">✕</button>`;
        document.querySelector('#fmodal-body').innerHTML = bodyHtml;
        document.querySelector('#fmodal').hidden = false;
        updateFilterCount();
    }

    let fmodalKind = null;

    function fmodalClose() {
        document.querySelector('#fmodal').hidden = true;
        fmodalKind = null;
    }

    function numInput(id, val, ph, cls) {
        return `<input type="number" id="${id}" value="${val ?? ''}" placeholder="${ph}" min="0"${cls ? ` class="${cls}"` : ''}>`;
    }

    function rangeRow(label, minId, maxId, f, minK, maxK) {
        return `<div class="frow"><span class="flbl">${label}</span><span class="finputs">${numInput(minId, f[minK], tr('fmod.min'))} – ${numInput(maxId, f[maxK], tr('fmod.max'))}</span></div>`;
    }

    function msToHms(ms) {
        if (ms == null) return ['', '', ''];
        const t = Math.floor(ms / 1000);
        return [String(Math.floor(t / 3600)), String(Math.floor(t % 3600 / 60)), String(t % 60)];
    }

    function durRow(label, prefix, ms) {
        const [h, m, s] = msToHms(ms);
        return `<div class="frow"><span class="flbl">${label}</span><span class="finputs">${numInput(prefix + 'h', h, tr('fmod.h'), 'h')}${numInput(prefix + 'm', m, tr('fmod.m'), 'h')}${numInput(prefix + 's', s, tr('fmod.s'), 'h')}</span></div>`;
    }

    function ckList(id, values, set) {
        if (!values.length) return `<div class="cklist" id="${id}"><span class="num">${tr('fmod.no_values')}</span></div>`;
        return `<div class="cklist" id="${id}">` + values.map(v =>
            `<label><input type="checkbox" data-val="${esc(v)}"${set.has(v) ? ' checked' : ''}>${esc(v)}</label>`).join('') + '</div>';
    }

    function bindNum(id, f, key, apply) {
        const el = document.querySelector('#' + id);
        el.addEventListener('input', () => {
            const n = el.value === '' ? null : Number(el.value);
            f[key] = n != null && Number.isFinite(n) ? n : null;
            apply();
        });
    }

    function bindHms(prefix, f, key, apply) {
        const g = k => document.querySelector('#' + prefix + k);
        const h = () => {
            f[key] = hmsToMs(g('h').value, g('m').value, g('s').value);
            apply();
        };
        ['h', 'm', 's'].forEach(k => g(k).addEventListener('input', h));
    }

    function bindCk(id, set, apply) {
        const box = document.querySelector('#' + id);
        box.addEventListener('change', e => {
            if (e.target.checked) set.add(e.target.dataset.val);
            else set.delete(e.target.dataset.val);
            apply();
        });
        document.querySelectorAll(`.cktog[data-for="${id}"]`).forEach(b => b.addEventListener('click', () => {
            const on = b.dataset.act === 'all';
            set.clear();
            box.querySelectorAll('input[type=checkbox]').forEach(c => {
                c.checked = on;
                if (on) set.add(c.dataset.val);
            });
            apply();
        }));
    }

    function ckAllNone(id) {
        return `<span class="cktogs"><button class="cktog" data-for="${id}" data-act="all" title="${esc(tr('fmod.all.tip'))}">${tr('fmod.all')}</button><button class="cktog" data-for="${id}" data-act="none" title="${esc(tr('fmod.none.tip'))}">${tr('fmod.none')}</button></span>`;
    }

    function collectValues(fn) {
        const s = new Set();
        (function walk(ns) {
            for (const n of ns) {
                s.add(fn(n));
                walk(n.children);
            }
        })(TREE);
        return [...s].sort();
    }

    function applyTreeFilter() {
        render();
        updateFilterBtns();
        saveSettings();
    }

    function refreshCalls() {
        const el = document.querySelector('#calls');
        if (el) el.innerHTML = callsTable(CALLS);
    }

    const bindHl = (id, key) => document.querySelector(id).addEventListener('input', e => {
        const v = e.target.value === '' ? null : Number(e.target.value);
        HOT[key] = v != null && Number.isFinite(v) ? v : null;
        render();
        refreshCalls();
        saveSettings();
    });
    bindHl('#hlwarn', 'warn');
    bindHl('#hlcrit', 'crit');

    document.querySelector('#hlapply').addEventListener('change', e => {
        HOT.apply = e.target.checked;
        render();
        refreshCalls();
        saveSettings();
    });

    document.querySelector('#reconly').addEventListener('change', e => {
        REC.only = e.target.checked;
        render();
        saveSettings();
    });

    function openTreeFilter() {
        const f = treeFilter;
        fmodalKind = 'tree';
        const dradio = (v, key) => `<label class="dateopt"><input type="radio" name="ft-dpreset" value="${v}"${(f.datePreset || '') === v ? ' checked' : ''}>${tr(key)}</label>`;
        fmodalOpen(tr('ftree.title'), `
        <div class="fsect">${tr('fmod.text')}</div>
        <div class="frow"><span class="finputs"><input type="text" id="ft-text" value="${esc(f.text)}" placeholder="${tr('ftree.text.ph')}" style="width:100%"></span></div>
        <div class="fsect">${tr('fmod.model')}${ckAllNone('ft-models')}</div>
        ${ckList('ft-models', collectValues(n => modelName(n.model)), f.models)}
        <div class="fsect">${tr('fmod.provider')}${ckAllNone('ft-provs')}</div>
        ${ckList('ft-provs', collectValues(nodeProvider), f.providers)}
        <div class="fsect">${tr('fmod.ranges')}</div>
        ${rangeRow(tr('calls.th.num'), 'ft-nummin', 'ft-nummax', f, 'numMin', 'numMax')}
        ${rangeRow(tr('ftree.ctx'), 'ft-ctxmin', 'ft-ctxmax', f, 'ctxMin', 'ctxMax')}
        ${rangeRow(tr('ftree.spent'), 'ft-spentmin', 'ft-spentmax', f, 'spentMin', 'spentMax')}
        ${durRow(tr('ftree.dur_min'), 'ft-dmin', f.durMin)}
        ${durRow(tr('ftree.dur_max'), 'ft-dmax', f.durMax)}
        <div class="fsect">${tr('ftree.date')}</div>
        <div class="frow"><span class="dateopts">${dradio('', 'fmod.any')}${dradio('today', 'ftree.date.today')}${dradio('week', 'ftree.date.week')}${dradio('month', 'ftree.date.month')}${dradio('custom', 'fmod.custom')}</span></div>
        <div class="frow" id="ft-drow"${f.datePreset === 'custom' ? '' : ' style="display:none"'}><span class="flbl">${tr('fmod.from_to')}</span><span class="finputs"><input type="date" id="ft-dfrom" value="${esc(f.dateFrom || '')}"><input type="date" id="ft-dto" value="${esc(f.dateTo || '')}"></span></div>
        <button class="freset" onclick="resetTreeFilter()">${tr('fmod.reset')}</button>`);
        const apply = applyTreeFilter;
        document.querySelector('#ft-text').addEventListener('input', e => {
            f.text = e.target.value;
            apply();
        });
        bindCk('ft-models', f.models, apply);
        bindCk('ft-provs', f.providers, apply);
        bindNum('ft-nummin', f, 'numMin', apply);
        bindNum('ft-nummax', f, 'numMax', apply);
        bindNum('ft-ctxmin', f, 'ctxMin', apply);
        bindNum('ft-ctxmax', f, 'ctxMax', apply);
        bindNum('ft-spentmin', f, 'spentMin', apply);
        bindNum('ft-spentmax', f, 'spentMax', apply);
        bindHms('ft-dmin', f, 'durMin', apply);
        bindHms('ft-dmax', f, 'durMax', apply);
        const updDates = () => {
            document.querySelector('#ft-drow').style.display = f.datePreset === 'custom' ? '' : 'none';
        };
        document.querySelectorAll('#fmodal input[name=ft-dpreset]').forEach(r => r.addEventListener('change', e => {
            if (!e.target.checked) return;
            f.datePreset = e.target.value || null;
            if (f.datePreset !== 'custom') {
                f.dateFrom = f.dateTo = null;
                document.querySelector('#ft-dfrom').value = '';
                document.querySelector('#ft-dto').value = '';
            }
            updDates();
            apply();
        }));
        [['ft-dfrom', 'dateFrom'], ['ft-dto', 'dateTo']].forEach(([id, k]) => {
            const el = document.querySelector('#' + id);
            el.addEventListener('input', () => {
                f[k] = el.value || null;
                if (f[k] && f.datePreset !== 'custom') {
                    f.datePreset = 'custom';
                    updDates();
                }
                apply();
            });
        });
    }

    function resetTreeFilter() {
        treeFilter = newTreeFilter();
        applyTreeFilter();
        openTreeFilter();
    }

    function applyCallFilter() {
        const el = document.querySelector('#calls');
        if (el) el.innerHTML = callsTable(CALLS);
        updateFilterBtns();
        saveSettings();
    }

    function openCallFilter() {
        const f = callFilter;
        fmodalKind = 'call';
        fmodalOpen(tr('fcall.title'), `
        <div class="fsect">${tr('fcall.text')}</div>
        <div class="frow"><span class="finputs"><input type="text" id="fc-text" value="${esc(f.text)}" placeholder="${tr('fcall.text.ph')}" style="width:100%"></span></div>
        <div class="fsect">${tr('fmod.ranges')}</div>
        ${rangeRow(tr('calls.th.num'), 'fc-nummin', 'fc-nummax', f, 'numMin', 'numMax')}
        ${rangeRow(tr('calls.th.ctx'), 'fc-ctxmin', 'fc-ctxmax', f, 'ctxMin', 'ctxMax')}
        ${rangeRow(tr('calls.th.delta'), 'fc-dmin', 'fc-dmax', f, 'deltaMin', 'deltaMax')}
        ${rangeRow(tr('calls.th.out'), 'fc-outmin', 'fc-outmax', f, 'outMin', 'outMax')}
        ${rangeRow(tr('calls.th.reason'), 'fc-rmin', 'fc-rmax', f, 'reasonMin', 'reasonMax')}
        ${rangeRow(tr('calls.th.in'), 'fc-inmin', 'fc-inmax', f, 'inMin', 'inMax')}
        ${rangeRow(tr('calls.th.cr'), 'fc-crmin', 'fc-crmax', f, 'crMin', 'crMax')}
        <button class="freset" onclick="resetCallFilter()">${tr('fmod.reset')}</button>`);
        const apply = applyCallFilter;
        document.querySelector('#fc-text').addEventListener('input', e => {
            f.text = e.target.value;
            apply();
        });
        [['fc-nummin', 'numMin'], ['fc-nummax', 'numMax'], ['fc-ctxmin', 'ctxMin'], ['fc-ctxmax', 'ctxMax'],
         ['fc-dmin', 'deltaMin'], ['fc-dmax', 'deltaMax'], ['fc-outmin', 'outMin'], ['fc-outmax', 'outMax'],
         ['fc-rmin', 'reasonMin'], ['fc-rmax', 'reasonMax'], ['fc-inmin', 'inMin'], ['fc-inmax', 'inMax'],
         ['fc-crmin', 'crMin'], ['fc-crmax', 'crMax']].forEach(([id, k]) => bindNum(id, f, k, apply));
    }

    function resetCallFilter() {
        callFilter = newCallFilter();
        applyCallFilter();
        openCallFilter();
    }

    function maxDepth(ns) {
        let d = 0;
        for (const x of ns) d = Math.max(d, 1 + maxDepth(x.children));
        return d
    }

    function setSort(k) {
        if (sortKey !== k) {
            sortKey = k;
            sortAsc = false;
        } else if (!sortAsc) {
            sortAsc = true;
        } else {
            sortKey = null;
            sortAsc = false;
        }
        render();
    }

    function sortVal(s) {
        return sortKey === 'dur' ? s.dur : sortKey === 'ctx' ? (s.maxctx || 0)
            : sortKey === 'time' ? (s.created || 0)
            : s.subtree.in + s.subtree.out + s.subtree.reason;
    }

    function sorted(ns) {
        return sortKey ? [...ns].sort((a, b) => sortAsc ? sortVal(a) - sortVal(b) : sortVal(b) - sortVal(a)) : ns;
    }

    function render() {
        let h = '';
        const roots = sorted(TREE.filter(s => matches(s)
            && (!hotFilterActive() || treeHotVisible(s, HOT.warn, HOT.crit))
            && (!REC.only || treeActiveVisible(s))));
        const HEARTS = heartSizes(roots);
        let mc = 0, mt = 0;
        (function scan(ns) {
            for (const x of ns) {
                if (x.maxctx > mc) mc = x.maxctx;
                const sp = x.subtree.in + x.subtree.out + x.subtree.reason;
                if (sp > mt) mt = sp;
                scan(x.children);
            }
        })(roots);
        VMAX = {ctx: mc, tok: mt};
        const th = (k, lbl, tip) => `<span class="val${k === 'time' ? ' v-idx' : k === 'ctx' ? ' v-ctx' : k === 'tok' ? ' v-tok' : ''} th${sortKey === k ? ' active' + (sortAsc ? ' asc' : '') : ''}" title="${tip}" onclick="setSort('${k}')"><span class="thl">${lbl}</span></span>`;
        const thc = (cls, lbl, tip) => `<span class="thc ${cls}" title="${esc(tip)}">${lbl}</span>`;
        h += `<div class="thead">${thc('hcol', tr('tree.th.ekg'), tr('tree.th.ekg.tip'))}<span class="hlead"></span>${th('time', tr('tree.th.time'), tr('tree.th.time.tip'))}${thc('grow', tr('tree.th.session'), tr('tree.th.session.tip'))}${thc('', tr('tree.th.model'), tr('tree.th.model.tip'))}<span class="vals">${th('dur', tr('tree.th.dur'), tr('tree.th.dur.tip'))}<span class="hsp"></span>${th('ctx', tr('tree.th.ctx'), tr('tree.th.ctx.tip'))}<span class="hsp"></span>${th('tok', tr('tree.th.spent'), tr('tree.th.spent.tip'))}</span></div>`;
        let groups = 0;
        SHOWN = {roots: 0, total: TREE.length};
        for (const [dirName, sessions] of docmap(roots)) {
            const vis = sessions.filter(matches);
            if (!vis.length) continue;
            groups++;
            SHOWN.roots += vis.length;
            const tot = vis.reduce((a, s) => {
                const t = s.subtree;
                return {spent: a.spent + t.in + t.out + t.reason}
            }, {spent: 0});
            h += `<div class="project">${dirName} — ${tr('tree.sessions', {n: vis.length})} · ${tr('tree.project.spent', {spent: fmt(tot.spent)})}</div><ul>`;
            for (const s of vis) h += node(s, 1, HEARTS);
            h += '</ul>';
        }
        if (!groups) h += `<div class="empty">${tr('tree.empty')}</div>`;
        document.querySelector('#tree').innerHTML = h;
        const allSpent = TREE.reduce((a, s) => a + s.subtree.in + s.subtree.out + s.subtree.reason, 0);
        document.querySelector('#summary').textContent = tr('summary', {n: TREE.length, spent: fmt(allSpent)});
        updateFilterCount();
    }

    const DEFAULT_AGENT = 'build';

    function node(s, depth, HEARTS) {
        const t = s.subtree;
        const kids = sorted(s.children).filter(k =>
            (!hotFilterActive() || treeHotVisible(k, HOT.warn, HOT.crit)) && (!REC.only || treeActiveVisible(k)));
        const hasSub = kids.length > 0;
        const spent = t.in + t.out + t.reason;
        const ctxPct = VMAX.ctx && s.maxctx ? Math.max(2, s.maxctx / VMAX.ctx * 100) : 0;
        const tokPct = VMAX.tok && spent ? Math.max(2, spent / VMAX.tok * 100) : 0;
        const subBadges = hasSub ? `<span class="badge sub">${tr('node.children_badge', {n: kids.length})}</span>` : '';
        const open = COLLAPSED.has(s.id) ? false : EXPANDED.has(s.id) ? true : (depth < 2 || hasSub && kids.length <= 6);
        const caret = hasSub ? `<span class="caret" onclick="toggle(event)">${open ? '−' : '+'}</span>` : `<span class="caret" style="visibility:hidden">·</span>`;
        const heart = s.active
            ? `<svg class="ecg${HEARTS.get(s.id) ? ' ' + HEARTS.get(s.id) : ''}" viewBox="0 0 34 20" title="${esc(tr('node.active.tip'))} · ${esc(tr('node.active.updated', {ago: dur(Date.now() - s.updated)}))}"><polyline points="${ecgPoints(s.beats, Date.now())}"/></svg>`
            : '<span class="hcol"></span>';
        const hl = hotLevel(s.maxctx, HOT.warn, HOT.crit);
            const agentBadge = s.agent && s.agent === DEFAULT_AGENT ? '' : `<span class="badge agent">${esc(s.agent || '—')}</span>`;
        let h = `<li><div class="node${depth === 1 ? ' root' : ''}${hl ? ' ' + hl : ''}${sel === s.id ? ' sel' : ''}" data-id="${s.id}">
    ${heart}
    ${caret}
    <span class="val v-idx" title="${when(s.created)}">${ORDER.get(s.id) || '·'}</span>
    <span class="ttl" title="${esc(s.title)}">${esc(agentBadge ? displayTitle(s.title, s.agent) : s.title)}</span>
    ${agentBadge}${subBadges}
    <span class="badge">${esc(modelName(s.model))}</span>
    <span class="vals"><span class="val v-dur" title="${tr('node.dur.tip')}">${dur(s.dur)}</span><span class="vbar" title="${tr('node.ctx.tip')}"><span style="width:${s.maxctx ? ctxPct : 0}%"></span></span><span class="val v-ctx" title="${tr('node.ctx.tip')}">${s.maxctx ? `<span class="ctxsize">${fmt(s.maxctx)}</span>` : '—'}</span><span class="vbar amber" title="${tr('node.spent.tip')}"><span style="width:${spent ? tokPct : 0}%"></span></span><span class="val v-tok" title="${tr('node.spent.tip')}"><b>${fmt(spent)}</b></span></span></div>`;
        if (hasSub) h += `<ul style="display:${open ? '' : 'none'}">${kids.map(k => node(k, depth + 1, HEARTS)).join('')}</ul>`;
        return h + '</li>';
    }

    function docmap(list) {
        const g = new Map();
        for (const s of list) {
            const k = s.dir || tr('tree.unknown_dir');
            if (!g.has(k)) g.set(k, []);
            g.get(k).push(s);
        }
        return [...g.entries()];
    }

    function toggle(e) {
        e.stopPropagation();
        const li = e.target.closest('li');
        const ul = li.querySelector(':scope > ul');
        if (!ul) return;
        ul.style.display = ul.style.display === 'none' ? '' : 'none';
        const id = li.querySelector('.node').dataset.id;
        if (ul.style.display === 'none') {
            COLLAPSED.add(id);
            EXPANDED.delete(id);
            e.target.textContent = '+';
        } else {
            EXPANDED.add(id);
            COLLAPSED.delete(id);
            e.target.textContent = '−';
        }
    }

    function esc(s) {
        return String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]))
    }

    function callsTable(calls) {
        if (!calls.length) {
            VISIBLE = [];
            return `<div class="empty">${tr('calls.empty')}</div>`;
        }
        const vis = visibleCallRows(calls, callFilter, c => when(c.time));
        VISIBLE = vis.map(r => r.n - 1);
        if (!vis.length) return `<div class="empty">${tr('calls.empty_filtered')}</div>`;
        const all = calls.map((c, i) => ({
            n: i + 1, ctx: c.ctx, delta: callDeltaAt(calls, i),
            out: c.out, reason: c.reason, in: c.in, cr: c.cr
        }));
        const mx = k => vis.reduce((m, r) => Math.max(m, r[k]), 1);
        const mCtx = mx('ctx'), mD = Math.max(1, ...vis.map(r => r.delta)),
            mOut = mx('out'), mRn = mx('reason'), mIn = mx('in'), mCr = mx('cr');
        const bar = (v, m) => `<span class="vbar"><span style="width:${v > 0 ? Math.max(2, v / m * 100) : 0}%"></span></span>`;
        let rows = '';
        vis.forEach(r => {
            const cls = r.hu ? 'hum' : hotLevel(r.ctx, HOT.warn, HOT.crit);
            rows += `<tr${cls ? ` class="${cls}"` : ''}${r.hu ? ` title="${tr('calls.hum.tip')}"` : ''} onclick="callPick('${esc(r.mid)}')">
  <td class="num">${r.hu ? '<span class="human-ic">👤</span>' : ''}${r.n}</td>
  <td class="num">${bar(r.ctx, mCtx)}<b class="ctxsize">${fmt(r.ctx)}</b></td>
  <td class="num">${bar(r.delta, mD)}${fmt(r.delta)}</td>
  <td class="num">${bar(r.out, mOut)}${fmt(r.out)}</td>
  <td class="num">${bar(r.reason, mRn)}${fmt(r.reason)}</td>
  <td class="num sep">${bar(r.in, mIn)}${fmt(r.in)}</td>
  <td class="num">${bar(r.cr, mCr)}${fmt(r.cr)}</td></tr>`;
        });
        const sum = rs => rs.reduce((a, r) => ({ctx: a.ctx + r.ctx, in: a.in + r.in, cr: a.cr + r.cr, out: a.out + r.out, reason: a.reason + r.reason}), {ctx: 0, in: 0, cr: 0, out: 0, reason: 0});
        const ta = sum(all), tv = sum(vis);
        const footRow = (lbl, t, lastCtx) => `<tr><td>${lbl}</td><td title="${tr('calls.foot.sum.tip')}">${fmt(t.ctx)}</td><td title="${tr('calls.foot.delta.tip')}">${fmt(lastCtx)}</td><td>${fmt(t.out)}</td><td>${fmt(t.reason)}</td><td>${fmt(t.in)}</td><td>${fmt(t.cr)}</td></tr>`;
        let foot;
        if (callFilterActive()) {
            foot = footRow(tr('calls.foot.filtered', {n: vis.length}), tv, vis[vis.length - 1].ctx)
                + footRow(tr('calls.foot.all_label', {n: calls.length}), ta, calls[calls.length - 1].ctx);
        } else {
            foot = footRow(tr('calls.foot.all', {n: calls.length}), ta, calls[calls.length - 1].ctx);
        }
        const heads = [
            [tr('calls.th.num'), tr('calls.th.num.tip'), ''],
            [tr('calls.th.ctx'), tr('calls.th.ctx.tip'), ''],
            [tr('calls.th.delta'), tr('calls.th.delta.tip'), ''],
            [tr('calls.th.out'), tr('calls.th.out.tip'), ''],
            [tr('calls.th.reason'), tr('calls.th.reason.tip'), ''],
            [tr('calls.th.in'), tr('calls.th.in.tip'), 'sep'],
            [tr('calls.th.cr'), tr('calls.th.cr.tip'), '']
        ];
        return `<table class="calls"><thead><tr>${heads.map(h => `<th${h[2] ? ` class="${h[2]}"` : ''} title="${h[1]}">${h[0]}</th>`).join('')}</tr></thead>
  <tbody>${rows}</tbody>
  <tfoot>${foot}</tfoot></table>`;
    }

    let curCall = -1;

    function modalClose() {
        curCall = -1;
        document.querySelector('#modal').hidden = true;
    }

    function callPick(mid) {
        const i = CALLS.findIndex(x => x.mid === mid);
        if (i >= 0) return showCall(i);
    }

    function callNav(d) {
        if (!VISIBLE.length) return;
        let p = VISIBLE.indexOf(curCall);
        if (p < 0) return showCall(d > 0 ? VISIBLE[0] : VISIBLE[VISIBLE.length - 1]);
        const np = p + d;
        if (np < 0 || np >= VISIBLE.length) return;
        return showCall(VISIBLE[np]);
    }

    function updateNav() {
        const p = VISIBLE.indexOf(curCall);
        document.querySelector('#cnav-prev').classList.toggle('disabled', p === 0 || !VISIBLE.length);
        document.querySelector('#cnav-next').classList.toggle('disabled', p === VISIBLE.length - 1 || !VISIBLE.length);
    }

    async function showCall(idx) {
        const c = CALLS[idx];
        if (!c) return;
        curCall = idx;
        const now = CALLS[CALLS.length - 1];
        const prev = CALLS[idx - 1];
        const d = prev ? c.ctx - prev.ctx : c.ctx;
        document.querySelector('#modal').hidden = false;
        document.querySelector('#modal-head').innerHTML = `<span>${tr('call.head', {n: c.n, total: CALLS.length, now: fmt(now.ctx), req: fmt(c.ctx), delta: fmt(d), fresh: fmt(c.in), out: fmt(c.out)})}</span><button id="modal-close" onclick="modalClose()">✕</button>`;
        updateNav();
        const body = document.querySelector('#modal-body');
        body.innerHTML = tr('loading');
        try {
            const r = await fetch('/api/trigger/' + encodeURIComponent(c.mid));
            if (!r.ok) throw new Error('HTTP ' + r.status);
            const j = await r.json();
            if (curCall !== idx) return;
            renderTrigger(j);
        } catch (e) {
            if (curCall === idx) body.innerHTML = `<div class="empty">${tr('load.fail', {msg: esc(e.message)})}</div>`;
        }
    }

    function renderTrigger(j) {
        const lbl = j.case === 'user' ? tr('trig.user')
            : j.case === 'assistant' ? tr('trig.assistant')
            : tr('trig.start');
        let h = `<div class="tblock"><div class="lbl">${lbl}</div></div>`;
        for (const p of (j.parts || [])) {
            if (p.kind === 'text') {
                h += `<div class="tblock"><div class="lbl">${tr('trig.text')}</div><pre class="prompt">${esc(p.text)}${p.cut ? '\n\n' + tr('trig.trunc') : ''}</pre></div>`;
            } else if (p.kind === 'tool') {
                h += `<div class="tblock"><div class="lbl">${tr('trig.tool', {tool: esc(p.tool), status: esc(p.status || '—')})}</div><pre class="prompt">${tr('trig.input')}
${esc(p.input)}${p.cut_i ? '\n' + tr('trig.trunc_in') : ''}${p.output ? `

${tr('trig.output')}
${esc(p.output)}${p.cut_o ? '\n' + tr('trig.trunc_out') : ''}` : ''}</pre></div>`;
            }
        }
        if (!(j.parts || []).length && j.case !== 'start') h += `<div class="empty">${tr('trig.empty')}</div>`;
        document.querySelector('#modal-body').innerHTML = h;
    }

    window.addEventListener('keydown', e => {
        if (!document.querySelector('#fmodal').hidden) {
            if (e.key === 'Escape') fmodalClose();
            return;
        }
        if (document.querySelector('#modal').hidden) return treeKey(e);
        if (e.key === 'Escape') modalClose();
        else if (e.key === 'ArrowLeft') callNav(-1);
        else if (e.key === 'ArrowRight') callNav(1);
    });

    async function getJson(u, errEl) {
        try {
            const r = await fetch(u);
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return await r.json();
        } catch (e) {
            if (errEl) errEl.innerHTML = tr('load.fail', {msg: esc(e.message)});
            return null;
        }
    }

    function metaDl(s) {
        const t = s.subtree;
        const mObj = s.model && typeof s.model === 'object' ? s.model : null;
        const mName = modelName(s.model);
        const mFull = mObj ? `${mObj.providerID || '—'} / ${mName}${mObj.variant ? ' · ' + mObj.variant : ''}` : mName;
        const kids = {in: t.in - s.in, out: t.out - s.out, reason: t.reason - s.reason, cr: t.cr - s.cr, cw: t.cw - s.cw};
        const row = (lbl, v, cls, tip) => `<tr${cls ? ` class="${cls}"` : ''}><th title="${esc(tip)}">${lbl}</th><td>${fmt(v.in)}</td><td>${fmt(v.out)}</td><td>${fmt(v.reason)}</td><td class="sep">${fmt(v.cr)}</td><td>${fmt(v.cw)}</td></tr>`;
        const hasKids = s.children.length > 0;
        return `<dl><dt>${tr('detail.ctx_now')}</dt><dd><span class="ctxsize" id="ctxnow">—</span></dd>
    <dt>${tr('detail.ctx_max')}</dt><dd>${s.maxctx ? `<span class="ctxsize">${fmt(s.maxctx)}</span>` : '—'}</dd>
    <dt>${tr('detail.agent_model')}</dt><dd>${esc(s.agent || '—')} / ${esc(mFull)}</dd>
    <dt>${tr('detail.dir')}</dt><dd>${esc(s.dir)}</dd>
    <dt>${tr('detail.created_updated')}</dt><dd>${when(s.created)} → ${when(s.updated)} (${dur(s.dur)})</dd></dl>
    <table class="tokgrid"><thead><tr><th></th><th>${tr('detail.tok.in')}</th><th>${tr('detail.tok.out')}</th><th>${tr('detail.tok.reason')}</th><th class="sep">${tr('detail.tok.cr')}</th><th>${tr('detail.tok.cw')}</th></tr></thead>
    <tbody>${row(tr('detail.tok.own'), s, 'own', tr('detail.own'))}${hasKids ? row(tr('detail.tok.kids', {n: s.children.length}), kids, 'kids', tr('detail.kids')) + row(tr('detail.tok.subtree'), t, 'total', tr('detail.subtree')) : ''}</tbody></table>`;
    }

    async function pick(id) {
        sel = id;
        const s = find(TREE, id);
        if (!s) return;
        document.querySelector('#detail').innerHTML = `<h2 id="dtitle" title="${esc(s.title)}">${esc(s.title)}</h2>
  <div class="meta" id="meta">${metaDl(s)}</div>
  <div class="sect">${tr('detail.calls')} <button class="fbtn" id="call-fbtn" onclick="openCallFilter()" title="${tr('filter.calls.btn.title')}">${tr('filter.btn')}</button></div><div id="calls">${tr('loading')}</div>
  <div class="sect">${tr('detail.prompt')}</div><pre class="prompt" id="pp">${tr('loading')}</pre>`;
        await fillDetail(id);
    }

    async function refreshDetail() {
        const id = sel;
        if (!id) return;
        const s = find(TREE, id);
        if (!s) return;
        const h2 = document.querySelector('#dtitle');
        if (h2) {
            h2.textContent = s.title;
            h2.title = s.title;
        }
        const dl = document.querySelector('#meta');
        if (dl) {
            dl.innerHTML = metaDl(s);
            if (CALLS.length) document.querySelector('#ctxnow').textContent = fmt(CALLS[CALLS.length - 1].ctx);
        }
        await fillDetail(id);
    }

    async function fillDetail(id) {
        const pP = getJson('/api/prompt/' + encodeURIComponent(id), document.querySelector('#pp'));
        const pC = getJson('/api/calls/' + encodeURIComponent(id), document.querySelector('#calls'));
        const pj = await pP;
        const cj = await pC;
        if (sel !== id) return;
        if (pj) {
            const pp = document.querySelector('#pp');
            pp.textContent = (pj.texts && pj.texts.length) ? pj.texts.join('\n\n—\n\n') : tr('prompt.empty');
        }
        if (cj) {
            CALLS = (cj.calls || []).map((c, i) => Object.assign({}, c, {n: i + 1}));
            document.querySelector('#calls').innerHTML = callsTable(CALLS);
            document.querySelector('#ctxnow').textContent = CALLS.length ? fmt(CALLS[CALLS.length - 1].ctx) : '—';
        }
        updateFilterBtns();
    }

    function find(ns, id) {
        for (const x of ns) {
            if (x.id === id) return x;
            const r = find(x.children, id);
            if (r) return r
        }
        return null
    }

    function markSel(id) {
        document.querySelectorAll('#tree .node.sel').forEach(x => x.classList.remove('sel'));
        const nd = document.querySelector(`#tree .node[data-id="${CSS.escape(id)}"]`);
        if (nd) nd.classList.add('sel');
        return nd;
    }

    function syncUrl(id, push) {
        if (typeof location === 'undefined' || typeof history === 'undefined') return;
        const h = id ? '#session=' + encodeURIComponent(id) : '';
        if (location.hash === h || (!h && !location.hash)) return;
        const url = location.pathname + location.search + h;
        if (push) history.pushState(null, '', url); else history.replaceState(null, '', url);
    }

    // expand every collapsed ancestor so the selected row is reachable in the tree
    function revealPath(id) {
        const path = [];
        (function walk(ns) {
            for (const x of ns) {
                if (x.id === id) return true;
                path.push(x.id);
                if (walk(x.children)) return true;
                path.pop();
            }
            return false;
        })(TREE);
        let changed = false;
        for (const a of path) {
            if (!EXPANDED.has(a)) changed = true;
            COLLAPSED.delete(a);
            EXPANDED.add(a);
        }
        if (changed) render();
    }

    function selectSession(id, o) {
        o = o || {};
        if (!find(TREE, id)) return false;
        if (o.reveal) revealPath(id);
        const nd = markSel(id);
        if (nd && o.scroll) nd.scrollIntoView({block: 'nearest'});
        syncUrl(id, !!o.push);
        if (sel !== id) {
            clearTimeout(selectSession.t);
            if (o.delay) {
                sel = id;
                selectSession.t = setTimeout(() => sel === id && pick(id), o.delay);
            } else pick(id);
        }
        return true;
    }

    function applyHashSel() {
        if (typeof location === 'undefined') return;
        const id = parseHashSel(location.hash);
        if (!id && sel) {
            clearTimeout(selectSession.t);
            sel = null;
            CALLS = [];
            markSel('');
            document.querySelector('#detail').innerHTML = `<div class="empty" id="detailempty">${tr('detail.select')}</div>`;
            return;
        }
        if (id && id !== sel) selectSession(id, {reveal: true, scroll: true});
    }

    window.addEventListener('popstate', applyHashSel);

    function visibleNodes() {
        return [...document.querySelectorAll('#tree .node')].filter(n => n.offsetParent !== null);
    }

    function treeKey(e) {
        if (e.ctrlKey || e.metaKey || e.altKey) return;
        const tag = (e.target && e.target.tagName) || '';
        if (/^(INPUT|SELECT|TEXTAREA)$/.test(tag) || (e.target && e.target.isContentEditable)) return;
        if (tag === 'BUTTON' && e.key === 'Enter') return;
        if (!['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter', 'Home', 'End'].includes(e.key)) return;
        const nodes = visibleNodes();
        if (!nodes.length) return;
        e.preventDefault();
        const cur = nodes.findIndex(n => n.dataset.id === sel);
        const go = i => selectSession(nodes[Math.max(0, Math.min(nodes.length - 1, i))].dataset.id, {scroll: true, delay: 150});
        if (e.key === 'ArrowDown') return go(cur < 0 ? 0 : cur + 1);
        if (e.key === 'ArrowUp') return go(cur < 0 ? 0 : cur - 1);
        if (e.key === 'Home') return go(0);
        if (e.key === 'End') return go(nodes.length - 1);
        if (cur < 0) return;
        const nd = nodes[cur], caret = nd.querySelector('.caret');
        const ul = nd.parentElement.querySelector(':scope > ul');
        const open = ul && ul.style.display !== 'none';
        if (e.key === 'Enter') {
            if (ul) caret.click();
        } else if (e.key === 'ArrowRight') {
            if (ul && !open) caret.click();
            else if (open) go(cur + 1);
        } else if (e.key === 'ArrowLeft') {
            if (open) caret.click();
            else {
                const up = nd.parentElement.parentElement.closest('li');
                if (up) selectSession(up.querySelector(':scope > .node').dataset.id, {scroll: true, delay: 150});
            }
        }
    }

    document.querySelector('#tree').addEventListener('click', e => {
        const nd = e.target.closest('.node');
        if (nd && !e.target.classList.contains('caret')) {
            if (nd.dataset.id === sel) return;
            selectSession(nd.dataset.id, {push: true});
        }
    });
    document.querySelector('#refresh').addEventListener('click', load);

    let refreshLeft = 5;

    function refreshLabel() {
        const b = document.querySelector('#refresh');
        const n = document.querySelector('#refnum');
        if (n) n.textContent = refreshLeft; else b.textContent = refreshLeft;
        b.title = tr('refresh.title', {n: refreshLeft});
    }

    function buildLangSwitcher() {
        const el = document.querySelector('#langsw');
        el.title = tr('lang.title');
        el.innerHTML = I18N.LANGS.map(l =>
            `<span data-lang="${l.code}"${I18N.curLang() === l.code ? ' class="on"' : ''}>${l.label}</span>`).join('');
        el.querySelectorAll('span').forEach(b => b.addEventListener('click', () => {
            if (I18N.curLang() !== b.dataset.lang) {
                I18N.setLang(b.dataset.lang);
                applyLang();
            }
        }));
    }

    function applyLangStatic() {
        document.documentElement.lang = I18N.curLang();
        document.title = tr('doc.title');
        const ps = document.querySelector('#provsel');
        if (ps) ps.title = tr('prov.tip');
        const fb = document.querySelector('#tree-fbtn');
        fb.title = tr('filter.btn.title');
        updateFilterBtns();
        document.querySelector('#hlbox').title = tr('hl.title');
        document.querySelector('#hllabel').textContent = tr('hl.label');
        document.querySelector('#hlwarn').title = tr('hl.warn.title');
        document.querySelector('#hlcrit').title = tr('hl.crit.title');
        document.querySelector('#hlapply').title = tr('hl.apply.title');
        document.querySelector('#hlapplylabel').title = tr('hl.apply.title');
        document.querySelector('#hlapplylabel').textContent = tr('hl.apply.label');
        document.querySelector('#recbox').title = tr('recent.only.title');
        document.querySelector('#reconly').title = tr('recent.only.title');
        document.querySelector('#reclabel').title = tr('recent.only.title');
        document.querySelector('#reclabel').textContent = tr('recent.only.label');
        document.querySelector('#version').title = tr('version.title');
        document.querySelector('#splitter').title = tr('splitter.title');
        const dbl = document.querySelector('#dblabel');
        if (dbl) dbl.textContent = tr('db.label');
        const dba = document.querySelector('#dbapply');
        if (dba) dba.textContent = tr('db.apply');
        const dbi = document.querySelector('#dbcustom');
        if (dbi) dbi.placeholder = tr('db.custom.placeholder');
        if (lastDbInfo) renderDbField(lastDbInfo);
        const de = document.querySelector('#detailempty');
        if (de) de.textContent = tr('detail.select');
        refreshLabel();
        buildLangSwitcher();
    }

    function applyLang() {
        applyLangStatic();
        render();
        if (sel) pick(sel);
        if (curCall >= 0) showCall(curCall);
        if (fmodalKind === 'tree') openTreeFilter();
        else if (fmodalKind === 'call') openCallFilter();
    }

    function refreshTick() {
        if (--refreshLeft <= 0) return load();
        refreshLabel();
    }

    async function load() {
        const sp = document.querySelector('#refresh');
        sp.classList.add('busy');
        refreshLeft = 5;
        refreshLabel();
        try {
            await syncProvider();
            const r = await fetch('/api/tree');
            const j = await r.json();
            if (j && j.error === 'db_not_found') {
                TREE = [];
                computeOrder();
                document.querySelector('#tree').innerHTML = `<div class="empty">${esc(tr('db.notfound'))}</div>`;
                const sum = document.querySelector('#summary');
                if (sum) sum.textContent = '';
                await refreshDbState();
                return;
            }
            TREE = j;
            computeOrder();
            render();
            refreshDetail();
            updateFilterBtns();
            if (!load.done) {
                load.done = true;
                applyHashSel();
            }
        } finally {
            sp.classList.remove('busy');
        }
    }

    const DB_STORE_KEY = 'db.path';
    let lastDbInfo = null;

    function lsGetDb() {
        if (typeof localStorage === 'undefined') return null;
        try { return localStorage.getItem(DB_STORE_KEY); } catch (e) { return null; }
    }

    function lsSetDb(v) {
        if (typeof localStorage === 'undefined') return;
        try {
            if (v === null) localStorage.removeItem(DB_STORE_KEY);
            else localStorage.setItem(DB_STORE_KEY, v);
        } catch (e) { }
    }

    async function fetchDbInfo() {
        try {
            const r = await fetch('/api/db');
            return r.ok ? await r.json() : null;
        } catch (e) { return null; }
    }

    const PROV_STORE_KEY = 'provider.name';

    function lsGetProv() {
        if (typeof localStorage === 'undefined') return null;
        try { return localStorage.getItem(PROV_STORE_KEY); } catch (e) { return null; }
    }

    function lsSetProv(v) {
        if (typeof localStorage === 'undefined') return;
        try {
            if (v === null) localStorage.removeItem(PROV_STORE_KEY);
            else localStorage.setItem(PROV_STORE_KEY, v);
        } catch (e) { }
    }

    async function fetchProvInfo() {
        try {
            const r = await fetch('/api/provider');
            return r.ok ? await r.json() : null;
        } catch (e) { return null; }
    }
