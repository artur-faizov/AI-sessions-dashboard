    async function postProvider(name) {
        try {
            const r = await fetch('/api/provider', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name })
            });
            return await r.json();
        } catch (e) { return { ok: false, error: String(e) }; }
    }

    const provLabel = n => n === 'claude' ? tr('prov.claude') : n === 'copilot' ? tr('prov.copilot') : n;

    let lastProv = null;

    function renderProvField(info) {
        lastProv = info.provider;
        const sel = document.querySelector('#provsel');
        if (!sel) return;
        sel.innerHTML = (info.providers || []).map(p =>
            `<option value="${esc(p)}"${p === info.provider ? ' selected' : ''}>${esc(provLabel(p))}</option>`).join('');
        refreshDbState(); // picker visibility follows the new provider's `switchable`
    }

    // The provider lives on the server; anything can flip it back while the
    // page is open (a restart resets it to the startup default, another tab
    // may switch it). Each refresh keeps the dropdown truthful and re-applies
    // the remembered choice when the server drifted from it.
    async function syncProvider() {
        const info = await fetchProvInfo();
        if (!info) return;
        const stored = lsGetProv();
        if (stored && stored !== info.provider) {
            const res = await postProvider(stored);
            if (res.ok) {
                renderProvField(await fetchProvInfo() || info);
                return;
            }
            lsSetProv(null); // no longer switchable — drop the stored choice
        }
        if (info.provider !== lastProv) renderProvField(info);
    }

    async function applyProvider(name) {
        const res = await postProvider(name);
        if (res.ok) {
            lsSetProv(name);
            await refreshDbState();
            load();
        } else {
            const sel = document.querySelector('#provsel');
            if (sel) {
                sel.title = res.error || tr('prov.tip');
                const info = await fetchProvInfo();
                if (info) renderProvField(info);
            }
        }
    }

    async function initProvField() {
        const info = await fetchProvInfo();
        if (info) renderProvField(info);
        const sel = document.querySelector('#provsel');
        if (sel) sel.addEventListener('change', () => applyProvider(sel.value));
        // stored choice from a previous run: re-apply it; if the provider is
        // no longer switchable (e.g. its data vanished) drop the stored value
        const stored = lsGetProv();
        if (info && stored && stored !== info.provider) {
            const res = await postProvider(stored);
            if (res.ok) {
                const ni = await fetchProvInfo();
                if (ni) renderProvField(ni);
            } else {
                lsSetProv(null);
                sel.title = res.error || tr('prov.tip');
            }
        }
    }

    async function postDbPath(path) {
        try {
            const r = await fetch('/api/db', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ path })
            });
            return await r.json();
        } catch (e) { return { ok: false, error: String(e) }; }
    }

    function dbOptionsHtml(info) {
        const cands = info.candidates || [];
        const opts = [];
        if (info.path && !cands.includes(info.path))
            opts.push(`<option value="${esc(info.path)}" selected>${esc(info.path)}</option>`);
        for (const p of cands)
            opts.push(`<option value="${esc(p)}"${p === info.path ? ' selected' : ''}>${esc(p)}</option>`);
        opts.push(`<option value="__custom__">${esc(tr('db.custom'))}</option>`);
        return opts.join('');
    }

    function renderDbField(info) {
        lastDbInfo = info;
        const sel = document.querySelector('#dbsel');
        if (!sel) return;
        sel.innerHTML = dbOptionsHtml(info);
        sel.title = info.found
            ? tr('db.title')
            : tr('db.missing.tip') + (info.error ? ' — ' + info.error : '');
        const wrap = document.querySelector('#dbwrap');
        if (wrap) {
            wrap.hidden = !info.switchable;
            if (info.found) wrap.classList.remove('missing');
            else wrap.classList.add('missing');
        }
    }

    async function refreshDbState() {
        const info = await fetchDbInfo();
        if (info) renderDbField(info);
        return info;
    }

    function showDbCustom(show) {
        const inp = document.querySelector('#dbcustom'), btn = document.querySelector('#dbapply');
        if (inp) inp.hidden = !show;
        if (btn) btn.hidden = !show;
    }

    async function applyDbPath(path) {
        const res = await postDbPath(path);
        if (res.ok) {
            lsSetDb(path);
            showDbCustom(false);
            await refreshDbState();
            load();
        } else {
            const wrap = document.querySelector('#dbwrap'), sel = document.querySelector('#dbsel');
            if (wrap) wrap.classList.add('missing');
            if (sel) sel.title = res.error || tr('db.missing.tip');
        }
    }

    async function initDbField() {
        const info = await fetchDbInfo();
        if (info) renderDbField(info);
        const sel = document.querySelector('#dbsel');
        if (sel) sel.addEventListener('change', async () => {
            if (sel.value === '__custom__') { showDbCustom(true); return; }
            await applyDbPath(sel.value);
        });
        const btn = document.querySelector('#dbapply');
        if (btn) btn.addEventListener('click', async () => {
            const inp = document.querySelector('#dbcustom');
            const p = ((inp && inp.value) || '').trim();
            if (p) await applyDbPath(p);
        });
        // stored custom path from a previous run: re-apply it; if it no longer
        // validates, the server keeps its autodetected DB and we drop the value
        const stored = lsGetDb();
        if (info && stored && stored !== info.path) {
            const res = await postDbPath(stored);
            if (res.ok) { await refreshDbState(); load(); }
            else lsSetDb(null);
        }
    }

    loadSettings();
    applyLangStatic();
    initProvField().then(() => { initDbField(); load(); });
    setInterval(refreshTick, 1000);

    // draggable splitter between tree and details
    (() => {
        const sp = document.querySelector('#splitter'), main = document.querySelector('main'),
            detail = document.querySelector('#detail');
        let drag = false;
        sp.addEventListener('mousedown', e => {
            drag = true;
            sp.classList.add('active');
            document.body.style.userSelect = 'none';
            e.preventDefault()
        });
        window.addEventListener('mousemove', e => {
            if (!drag) return;
            const r = main.getBoundingClientRect();
            let pct = (r.right - e.clientX) / r.width * 100;
            pct = Math.max(20, Math.min(80, pct));
            detail.style.width = pct + '%';
            detail.style.minWidth = '0';
        });
        window.addEventListener('mouseup', () => {
            drag = false;
            sp.classList.remove('active');
            document.body.style.userSelect = ''
        });
        sp.addEventListener('dblclick', () => {
            detail.style.width = '44%'
        });
    })();
</script>
</body>
</html>
