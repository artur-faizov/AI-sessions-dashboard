<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>OpenCode Token Usage</title>
    <style>
        :root {
            --bg: #14161a;
            --fg: #e6e6e6;
            --dim: #8a8f98;
            --line: #2a2d33;
            --acc: #7aa2f7;
            --user: #9ece6a;
            --sub: #e0af68
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font: 14px/1.45 -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--fg);
            height: 100vh;
            display: flex;
            flex-direction: column
        }

        header {
            position: sticky;
            top: 0;
            background: var(--bg);
            border-bottom: 1px solid var(--line);
            padding: 10px 18px;
            display: flex;
            gap: 16px;
            align-items: flex-start;
            z-index: 5
        }

        .hgrp {
            display: flex;
            gap: 16px;
            align-items: center;
            min-width: 0
        }

        .hgrp.center {
            margin: 0 auto;
            flex-wrap: wrap
        }

        .hgrp.right {
            margin-left: auto;
            flex: none
        }

        header h1 {
            font-size: 15px;
            margin: 0;
            font-weight: 600;
            line-height: 29px
        }

        #provsel {
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            background: transparent;
            color: inherit;
            border: 1px solid transparent;
            border-radius: 6px;
            padding: 1px 2px;
            cursor: pointer
        }

        #provsel:hover,
        #provsel:focus {
            border-color: var(--line);
            background: var(--bg)
        }

        .ver {
            border-left: 1px solid var(--line);
            padding-left: 16px;
            font-size: 12px;
            color: var(--dim);
            font-variant-numeric: tabular-nums
        }

        .headcol {
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: flex-start;
            flex: none
        }
        .dbwrap {
            display: inline-flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap
        }

        .dblabel {
            color: var(--dim);
            font-size: 12px
        }

        #dbsel {
            background: #1d2026;
            color: var(--fg);
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 3px 8px;
            font: inherit;
            font-size: 12px;
            max-width: 280px
        }

        #dbsel option {
            background: #1d2026
        }

        .dbcustom {
            background: #1d2026;
            color: var(--fg);
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 3px 8px;
            font: inherit;
            font-size: 12px;
            width: 300px
        }

        .dbwrap.missing #dbsel,
        .dbwrap.missing .dbcustom {
            border-color: #f7768e;
            box-shadow: 0 0 0 1px #f7768e
        }

        .fbtn {
            background: #1d2026;
            border: 1px solid var(--line);
            color: var(--fg);
            border-radius: 6px;
            padding: 4px 12px;
            cursor: pointer;
            font: inherit;
            font-size: 13px;
            font-weight: 600
        }

        .fbtn:hover {
            border-color: var(--acc)
        }

        .fbtn.on {
            background: var(--acc);
            border-color: var(--acc);
            color: #1a1a1a
        }

        .fbtn.on:hover {
            background: #8db1ff
        }

        .rbtn {
            background: #1d2026;
            border: 1px solid var(--line);
            color: var(--dim);
            border-radius: 6px;
            padding: 3px 10px;
            display: inline-flex;
            gap: 6px;
            align-items: center;
            cursor: pointer;
            font: inherit;
            font-size: 13px;
            font-variant-numeric: tabular-nums;
            user-select: none
        }

        .ricon {
            width: 13px;
            height: 13px;
            display: block
        }

        .rbtn:hover {
            color: var(--fg);
            border-color: var(--acc)
        }

        .rbtn.busy {
            color: var(--acc);
            border-color: var(--acc)
        }

        .langsw {
            display: inline-flex;
            border: 1px solid var(--line);
            border-radius: 6px;
            overflow: hidden;
            user-select: none;
            font-size: 12px
        }

        .langsw span {
            padding: 3px 8px;
            cursor: pointer;
            color: var(--dim);
            background: #1d2026
        }

        .langsw span:hover {
            color: var(--fg)
        }

        .langsw span.on {
            color: var(--acc);
            background: #232730;
            font-weight: 600
        }

        .gearwrap {
            position: relative;
            display: inline-flex
        }

        .gearmenu {
            position: fixed;
            left: 18px;
            right: 18px;
            top: 64px;
            background: var(--bg);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 10px 12px 12px;
            z-index: 20;
            box-shadow: 0 4px 8px rgba(0, 0, 0, .35);
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            align-items: flex-start;
            align-content: flex-start;
            gap: 14px;
            max-height: calc(100vh - 90px);
            overflow-y: auto
        }

        .gearmenu .mcol {
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 240px
        }

        .gearmenu .mcol.wide {
            flex: 1 1 320px
        }

        .gearmenu[hidden] {
            display: none
        }

        .gearmenu .grow {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px
        }

        .gearmenu .grow.cost {
            gap: 8px
        }

        .gearmenu .grow.cost label {
            display: flex;
            gap: 7px;
            align-items: center;
            flex: 1;
            min-width: 0;
            cursor: pointer
        }

        .gearmenu input[type=number] {
            background: #1d2026;
            border: 1px solid var(--line);
            color: var(--fg);
            border-radius: 6px;
            padding: 4px 7px;
            width: 78px;
            font: inherit;
            font-size: 13px
        }

        .gearmenu input[type=number]:focus {
            outline: none;
            border-color: var(--acc)
        }

        .gearmenu input[type=checkbox] {
            accent-color: var(--acc);
            cursor: pointer
        }

        .gearmenu .cur {
            color: var(--dim);
            flex: none
        }

        .gearmenu .gformula {
            color: var(--dim);
            font-size: 12px;
            line-height: 1.5;
            word-break: break-word
        }

        .gearmenu .sect {
            margin: 2px 0 0
        }

        .gearmenu .ver {
            border-left: none;
            padding-left: 0
        }

        .gearmenu .freset {
            margin-top: 6px;
            align-self: flex-start
        }

        .gearmenu .mrow {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 6px
        }

        .gearmenu .mcard {
            display: flex;
            flex-direction: column;
            gap: 3px;
            border: 1px solid var(--dim, #555);
            border-radius: 4px;
            padding: 5px 7px;
            min-width: 130px
        }

        .gearmenu .mcard .mname {
            font-size: 12px;
            font-weight: bold;
            word-break: break-all
        }

        .gearmenu .mcard .mrow2 {
            display: flex;
            align-items: center;
            gap: 4px
        }

        .gearmenu .mcard label {
            flex: none;
            width: auto
        }

        .gearmenu .mcard .mtot {
            color: var(--dim);
            font-size: 11px
        }

        .hlbox {
            display: flex;
            gap: 6px;
            align-items: center;
            color: var(--dim);
            font-size: 13px;
            cursor: default
        }

        .hlbox input[type=number] {
            background: #1d2026;
            border: 1px solid var(--line);
            color: var(--fg);
            border-radius: 6px;
            padding: 4px 7px;
            width: 64px;
            font: inherit;
            font-size: 13px
        }

        .hlbox input[type=number]:focus {
            outline: none;
            border-color: var(--acc)
        }

        .hlbox input[type=checkbox] {
            accent-color: var(--acc);
            cursor: pointer
        }

        .node.warn {
            background: rgba(230, 200, 80, .16)
        }

        .node.warn:hover {
            background: rgba(230, 200, 80, .28)
        }

        .node.crit {
            background: rgba(247, 118, 142, .16)
        }

        .node.crit:hover {
            background: rgba(247, 118, 142, .28)
        }

        .node.sel {
            box-shadow: inset 0 0 0 2px var(--acc)
        }

        .node.sel:not(.warn):not(.crit) {
            background: rgba(122, 162, 247, .12)
        }

        table.calls tbody tr.warn {
            background: rgba(230, 200, 80, .16)
        }

        table.calls tbody tr.warn:hover {
            background: rgba(230, 200, 80, .28)
        }

        table.calls tbody tr.crit {
            background: rgba(247, 118, 142, .16)
        }

        table.calls tbody tr.crit:hover {
            background: rgba(247, 118, 142, .28)
        }

        table.calls tbody tr.hum td {
            background: rgba(124, 200, 100, .32);
            box-shadow: inset 0 1px 0 rgba(124, 200, 100, .55), inset 0 -1px 0 rgba(124, 200, 100, .55)
        }

        table.calls tbody tr.hum:hover td {
            background: rgba(124, 200, 100, .45)
        }

        table.calls tbody tr.hum td:first-child {
            border-radius: 8px 0 0 8px;
            box-shadow: inset 1px 0 0 rgba(124, 200, 100, .55), inset 0 1px 0 rgba(124, 200, 100, .55), inset 0 -1px 0 rgba(124, 200, 100, .55)
        }

        table.calls tbody tr.hum td:last-child {
            border-radius: 0 8px 8px 0;
            box-shadow: inset -1px 0 0 rgba(124, 200, 100, .55), inset 0 1px 0 rgba(124, 200, 100, .55), inset 0 -1px 0 rgba(124, 200, 100, .55)
        }

        .human-ic {
            margin-right: 4px;
            vertical-align: -2px
        }

        main {
            display: flex;
            flex: 1;
            min-height: 0
        }

        #tree {
            flex: 1;
            overflow: auto;
            padding: 0 18px 12px
        }

        #splitter {
            flex: 0 0 5px;
            cursor: col-resize;
            background: var(--line);
            transition: background .15s
        }

        #splitter:hover, #splitter.active {
            background: var(--acc)
        }

        #detail {
            width: 44%;
            min-width: 300px;
            border-left: 1px solid var(--line);
            overflow: auto;
            padding: 16px 20px
        }

        ul, li {
            list-style: none;
            margin: 0;
            padding: 0
        }

        li li > .node {
            padding-left: 56px
        }

        li li li > .node {
            padding-left: 112px
        }

        li li li li > .node {
            padding-left: 168px
        }

        .node {
            position: relative;
            display: flex;
            gap: 10px;
            align-items: baseline;
            padding: 4px 6px;
            border-radius: 6px;
            cursor: pointer;
            flex-wrap: wrap;
            margin-bottom: 1px
        }

        .node:hover {
            background: #1d2026
        }

        .chkcol {
            width: 16px;
            flex: none;
            text-align: center
        }

        .node input.mark {
            width: 14px;
            height: 14px;
            flex: none;
            margin: 0 1px;
            cursor: pointer;
            accent-color: #61afef
        }

        .hcol {
            width: 68px;
            text-align: center;
            flex: none
        }

        .ecg {
            width: 68px;
            height: 20px;
            flex: none;
            overflow: visible
        }

        .ecg.lg {
            height: 30px
        }

        .ecg.xl {
            height: 40px
        }

        .ecg polyline {
            fill: none;
            stroke: #e5484d;
            stroke-width: 1.3
        }

        .hlbox .ecg {
            width: 22px;
            height: 13px;
            flex: none
        }

        .node .ttl {
            flex: 1;
            min-width: 180px;
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }

        .node.root > .ttl {
            font-weight: 700
        }

        .badge {
            font-size: 11px;
            padding: 1px 7px;
            border-radius: 10px;
            background: #232730;
            color: var(--dim);
            white-space: nowrap
        }

        .badge.agent {
            color: var(--user)
        }

        .badge.sub {
            color: var(--sub)
        }

        .num {
            font-variant-numeric: tabular-nums;
            font-size: 12px;
            color: var(--dim);
            white-space: nowrap
        }

        .num b {
            color: var(--fg)
        }

        .num b.ctxsize {
            color: #1a1a1a
        }

        .vals {
            display: inline-flex;
            gap: 8px;
            flex: none;
            align-items: baseline
        }

        .val {
            display: inline-block;
            width: 5ch;
            text-align: right;
            font-size: 12px;
            color: var(--dim);
            font-variant-numeric: tabular-nums;
            white-space: nowrap
        }

        .val b {
            color: var(--fg)
        }

        .v-idx {
            width: 3.5ch
        }

        .v-ctx {
            width: 6ch
        }

        .v-tok {
            width: 5.5ch
        }

        .v-money {
            width: 6ch
        }

        .vbar {
            display: inline-block;
            width: 20px;
            height: 5px;
            border-radius: 3px;
            background: #232730;
            vertical-align: middle;
            overflow: hidden;
            flex: none
        }

        .vbar span {
            display: block;
            height: 100%;
            border-radius: 3px;
            background: var(--acc)
        }

        .vbar.amber span {
            background: var(--sub)
        }

        .vbar.green span {
            background: var(--user)
        }

        .thead {
            position: sticky;
            top: 0;
            z-index: 2;
            background: #262b36;
            display: flex;
            gap: 10px;
            align-items: baseline;
            padding: 7px 4px;
            margin-bottom: 6px;
            border: 2px solid #3d4455;
            box-shadow: 0 4px 8px rgba(0, 0, 0, .35)
        }

        .thead .grow {
            flex: 1
        }

        .hlead {
            width: 14px;
            flex: none
        }

        .thc, .thl {
            font-size: 13px;
            font-weight: 700;
            color: var(--fg);
            white-space: nowrap
        }

        .hsp {
            width: 20px;
            flex: none
        }

        .th {
            cursor: pointer;
            overflow: visible
        }

        .th:hover .thl {
            color: var(--acc)
        }

        .th.active, .th.active .thl {
            color: var(--acc);
            position: relative
        }

        .th.active::after {
            content: '▾';
            position: absolute;
            right: 100%;
            margin-right: 3px
        }

        .th.active.asc::after {
            content: '▴'
        }

        .caret {
            cursor: pointer;
            color: var(--dim);
            width: 14px;
            display: inline-block;
            user-select: none
        }

        .project {
            color: var(--dim);
            font-size: 12px;
            padding: 10px 0 2px 6px;
            letter-spacing: .3px
        }

        #detail h2 {
            font-size: 15px;
            margin: 0 0 8px
        }

        pre.prompt {
            white-space: pre-wrap;
            word-break: break-word;
            background: #1a1d22;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 12px;
            font-size: 12.5px;
            max-height: 38vh;
            overflow: auto
        }

        .sect {
            color: var(--dim);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: .5px;
            margin: 14px 0 6px
        }

        .empty {
            color: var(--dim);
            padding: 30px;
            text-align: center
        }

        table.calls {
            border-collapse: separate;
            border-spacing: 0;
            width: 100%;
            font-size: 12px;
            font-variant-numeric: tabular-nums
        }

        table.calls th {
            text-align: left;
            color: var(--dim);
            font-weight: 500;
            padding: 3px 6px;
            border-bottom: 1px solid var(--line)
        }

        table.calls td {
            padding: 3px 6px;
            border-bottom: 1px solid #1f2229
        }

        .ctxsize {
            background: #ffd43b;
            color: #1a1a1a;
            font-weight: 700;
            padding: 0 5px;
            border-radius: 4px
        }

        table.calls .vbar {
            margin-right: 6px
        }

        table.calls tbody tr {
            cursor: pointer
        }

        table.calls tbody tr:hover {
            background: #1d2026
        }

        table.calls .sep {
            border-left: 1px solid var(--line);
            padding-left: 10px
        }

        #modal {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center
        }

        #modal[hidden] {
            display: none
        }

        #modal-bg {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, .55)
        }

        #modal-box {
            position: relative;
            background: var(--bg);
            border: 1px solid var(--line);
            border-radius: 10px;
            width: min(860px, 92vw);
            height: min(760px, 86vh);
            display: flex;
            flex-direction: column
        }

        .cnav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 40px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            color: #4a2f00;
            background: #f8c471;
            border: 1px solid #d99a3d;
            border-radius: 8px;
            cursor: pointer;
            user-select: none;
            font-weight: 700
        }

        .cnav:hover {
            background: #f5ae4a
        }

        .cnav.disabled {
            opacity: .25;
            cursor: default
        }

        .cnav.prev {
            left: -52px
        }

        .cnav.next {
            right: -52px
        }

        #modal-head {
            padding: 10px 16px;
            border-bottom: 1px solid var(--line);
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px;
            font-size: 13px;
            background: #a9c7f2;
            color: #14213d;
            border-radius: 9px 9px 0 0
        }

        #modal-head .num {
            color: #41557a
        }

        #modal-close {
            cursor: pointer;
            color: #41557a;
            border: none;
            background: none;
            font-size: 16px;
            padding: 2px 6px
        }

        #modal-close:hover {
            color: #14213d
        }

        #modal-body {
            padding: 12px 16px;
            overflow: auto
        }

        .tblock {
            margin: 10px 0
        }

        .tblock .lbl {
            color: var(--dim);
            font-size: 12px;
            margin-bottom: 4px
        }

        .tblock pre.prompt {
            max-height: 40vh
        }

        #fmodal {
            position: fixed;
            inset: 0;
            z-index: 12;
            display: flex;
            align-items: center;
            justify-content: center
        }

        #fmodal[hidden] {
            display: none
        }

        #fmodal-bg {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, .55)
        }

        #fmodal-box {
            position: relative;
            background: var(--bg);
            border: 1px solid var(--line);
            border-radius: 10px;
            width: min(430px, 92vw);
            max-height: 86vh;
            display: flex;
            flex-direction: column
        }

        #fmodal-head {
            padding: 10px 14px;
            border-bottom: 1px solid var(--line);
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px;
            font-size: 13px;
            font-weight: 600
        }

        #fmodal-body {
            padding: 6px 14px 14px;
            overflow: auto
        }

        .xbtn {
            cursor: pointer;
            color: var(--dim);
            border: none;
            background: none;
            font-size: 16px;
            padding: 2px 6px;
            font-weight: 400
        }

        .xbtn:hover {
            color: var(--fg)
        }

        .fsect {
            color: var(--dim);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .5px;
            margin: 12px 0 5px;
            display: flex;
            align-items: center
        }

        .cktogs {
            margin-left: auto;
            display: inline-flex;
            gap: 4px
        }

        .cktog {
            background: none;
            border: 1px solid var(--line);
            color: var(--dim);
            border-radius: 4px;
            padding: 0 7px;
            cursor: pointer;
            font: inherit;
            font-size: 11px;
            text-transform: none;
            letter-spacing: 0
        }

        .cktog:hover {
            color: var(--fg);
            border-color: var(--acc)
        }

        .fcount {
            margin-left: auto;
            color: var(--dim);
            font-weight: 400;
            font-size: 12px;
            font-variant-numeric: tabular-nums
        }

        .frow {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 7px 0;
            font-size: 13px
        }

        .flbl {
            width: 112px;
            flex: none;
            color: var(--dim)
        }

        .finputs {
            display: inline-flex;
            gap: 6px;
            align-items: center;
            flex: 1
        }

        .finputs input {
            background: #1d2026;
            border: 1px solid var(--line);
            color: var(--fg);
            border-radius: 6px;
            padding: 4px 8px;
            width: 90px;
            font: inherit;
            font-size: 13px
        }

        .finputs input:focus {
            outline: none;
            border-color: var(--acc)
        }

        .finputs input.h {
            width: 54px
        }

        .finputs input[type=date] {
            width: 128px
        }

        #ft-drow .finputs {
            flex-wrap: wrap
        }

        .cklist {
            max-height: 132px;
            overflow: auto;
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 6px 9px;
            display: flex;
            flex-direction: column;
            gap: 4px
        }

        .cklist label {
            display: flex;
            gap: 7px;
            align-items: center;
            font-size: 13px;
            cursor: pointer
        }

        .dateopts {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 12px;

<script src="/i18n.js"></script>
<script>
    let TREE = [], CALLS = [], VISIBLE = [], sel = null, VMAX = {ctx: 0, tok: 0, money: 0},
        sortKey = null, sortAsc = false, ORDER = new Map(), COLLAPSED = new Set(), EXPANDED = new Set();
    const tr = I18N.tr;

    function computeOrder() {
        ORDER = new Map();
        [...TREE].sort((a, b) => (a.created || 0) - (b.created || 0)).forEach((r, i) => {
            ORDER.set(r.id, i + 1);
            r.order = i + 1;
        });
        (function walk(ns) {
            for (const x of ns) {
                [...x.children].sort((a, b) => (a.created || 0) - (b.created || 0))
                    .forEach((c, i) => {
                        ORDER.set(c.id, i + 1);
                        c.order = i + 1;
                    });
                walk(x.children);
            }
        })(TREE);
    }
    const fmt = n => {
        const a = Math.abs(n || 0), s = n < 0 ? '-' : '';
        return a >= 1e6 ? s + (a / 1e6).toFixed(1) + 'M' : a >= 1e3 ? s + (a / 1e3).toFixed(1) + 'k' : s + a;
    };
    const fmtMoney = n => {
        const a = Math.abs(n || 0), s = n < 0 ? '-' : '';
        if (!a) return '$0';
        if (a < 0.01) return '$' + s + a.toFixed(4);
        if (a < 1e4) return '$' + s + a.toFixed(2);
        return a >= 1e6 ? '$' + s + (a / 1e6).toFixed(1) + 'M' : '$' + s + (a / 1e3).toFixed(1) + 'k';
    };
    const dur = ms => ms < 0 ? '—' : ms < 6e4 ? (ms / 1e3).toFixed(0) + 's' : ms < 36e5 ? (ms / 6e4).toFixed(1) + 'm' : (ms / 36e5).toFixed(1) + 'h';
    const when = t => t ? new Date(t).toLocaleString(I18N.locale()) : '—';
    // FILTER-LOGIC-START
    // Pure filter predicates — no DOM access. test/filter.test.mjs extracts exactly
    // this block and runs it in node, so keep it self-contained between the markers.
    const COST_DEF = {in: {on: true, price: 4}, out: {on: true, price: 20}, reason: {on: true, price: 20}, cw: {on: true, price: 5}, cr: {on: true, price: 0.2}};
    let COST = JSON.parse(JSON.stringify(COST_DEF));

    // t = {in, out, reason, cr, cw} token counts; returns dollars
    function costOf(t) {
        return (COST.in.on ? t.in / 1e6 * COST.in.price : 0) + (COST.out.on ? t.out / 1e6 * COST.out.price : 0)
            + (COST.reason.on ? t.reason / 1e6 * COST.reason.price : 0) + (COST.cw.on ? t.cw / 1e6 * COST.cw.price : 0)
            + (COST.cr.on ? t.cr / 1e6 * COST.cr.price : 0);
    }

    // money-weighted token count, normalized to fresh-input equivalents
    function tokEqOf(t) {
        const p = COST.in.price || 1;
        return (COST.in.on ? t.in : 0) + (COST.out.on ? t.out * COST.out.price / p : 0)
            + (COST.reason.on ? t.reason * COST.reason.price / p : 0) + (COST.cw.on ? t.cw * COST.cw.price / p : 0)
            + (COST.cr.on ? t.cr * COST.cr.price / p : 0);
    }

    function resetCost() {
        Object.keys(COST).forEach(k => delete COST[k]);
        Object.assign(COST, JSON.parse(JSON.stringify(COST_DEF)));
        MCOST = {};
    }

    // Per-model price overrides: model -> {in: price, ...}; a missing field
    // falls back to the global COST price.
    let MCOST = {};

    // t = {in, out, reason, cr, cw} token counts, model = string or undefined;
    // returns dollars using per-model overrides where set.
    function costT(t, model) {
        const o = model ? MCOST[model] : null;
        const p = k => (o && o[k] != null) ? +o[k] : COST[k].price;
        return (COST.in.on ? (t.in || 0) / 1e6 * p('in') : 0) + (COST.out.on ? (t.out || 0) / 1e6 * p('out') : 0)
            + (COST.reason.on ? (t.reason || 0) / 1e6 * p('reason') : 0) + (COST.cw.on ? (t.cw || 0) / 1e6 * p('cw') : 0)
            + (COST.cr.on ? (t.cr || 0) / 1e6 * p('cr') : 0);
    }

    // Node cost: per-model subtree sums when present, else global subtree cost.
    function costNode(n) {
        if (n && n.bymodel) {
            let s = 0, any = false;
            for (const m of Object.keys(n.bymodel)) { s += costT(n.bymodel[m], m); any = true; }
            if (any) return s;
        }
        return costT((n && n.subtree) || {});
    }

    function modelName(m) {
        return !m ? '—' : typeof m === 'object' ? (m.modelID || m.id || '—') : m;
    }

    function nodeProvider(n) {
        return n.model && typeof n.model === 'object' ? (n.model.providerID || '(none)') : '(none)';
    }

    function inRange(v, min, max) {
        return (min == null || v >= min) && (max == null || v <= max);
    }

    function hmsToMs(h, m, s) {
        if ([h, m, s].every(x => x === '' || x == null)) return null;
        const num = x => (x === '' || x == null || isNaN(Number(x))) ? 0 : Number(x);
        return (num(h) * 3600 + num(m) * 60 + num(s)) * 1000;
    }

    function kilo(k) {
        return k == null ? null : k * 1000;
    }

    function presetRange(preset, now) {
        if (preset !== 'today' && preset !== 'week' && preset !== 'month') return [null, null];
        const d = new Date(now);
        d.setHours(0, 0, 0, 0);
        if (preset === 'week') d.setDate(d.getDate() - (d.getDay() + 6) % 7);
        else if (preset === 'month') d.setDate(1);
        return [d.getTime(), null];
    }

    function dayStartMs(str) {
        if (!str) return null;
        const t = new Date(str + 'T00:00').getTime();
        return Number.isFinite(t) ? t : null;
    }

    function dateStrToRange(from, to) {
        const mn = dayStartMs(from), mx = dayStartMs(to);
        return [mn, mx == null ? null : mx + 86400000 - 1];
    }

    function resolveDateBounds(f, now) {
        if (f.datePreset === 'custom') return dateStrToRange(f.dateFrom, f.dateTo);
        return presetRange(f.datePreset, now);
    }

    function nodeDir(n) {
        return n.dir || '(unknown)';
    }

    function treeMatchesNode(n, f) {
        if (f.text) {
            const hay = (n.title + ' ' + n.agent + ' ' + modelName(n.model)).toLowerCase();
            if (!hay.includes(f.text.toLowerCase())) return false;
        }
        if (f.models.size && !f.models.has(modelName(n.model))) return false;
        if (f.providers.size && !f.providers.has(nodeProvider(n))) return false;
        if (f.dirs.size && !f.dirs.has(nodeDir(n))) return false;
        if (!inRange(n.order || 0, f.numMin, f.numMax)) return false;
        if (!inRange(n.created || 0, f.dateMin, f.dateMax)) return false;
        if (!inRange(n.maxctx || 0, kilo(f.ctxMin), kilo(f.ctxMax))) return false;
        if (!inRange(costNode(n), f.spentMin, f.spentMax)) return false;
        if (!inRange(n.dur, f.durMin, f.durMax)) return false;
        return true;
    }

    function treeVisible(n, f) {
        return treeMatchesNode(n, f) || n.children.some(c => treeVisible(c, f));
    }

    function hotLevel(v, warn, crit) {
        if (crit != null && v > crit * 1000) return 'crit';
        if (warn != null && v > warn * 1000) return 'warn';
        return '';
    }

    function treeHotVisible(n, warn, crit) {
        return !!hotLevel(n.maxctx, warn, crit) || n.children.some(c => treeHotVisible(c, warn, crit));
    }

    function treeActiveVisible(n) {
        return !!n.active || n.children.some(c => treeActiveVisible(c));
    }

    function treeCheckedVisible(n, marked) {
        return marked.has(n.id) || n.children.some(c => treeCheckedVisible(c, marked));
    }

    function treeFilterCount(f) {
        const set = (a, b) => a != null || b != null;
        return [
            !!f.text, f.models.size > 0, f.providers.size > 0, f.dirs.size > 0, set(f.numMin, f.numMax),
            f.datePreset != null && (f.datePreset !== 'custom' || !!f.dateFrom || !!f.dateTo),
            set(f.ctxMin, f.ctxMax), set(f.spentMin, f.spentMax), set(f.durMin, f.durMax)
        ].filter(Boolean).length;
    }

    function heartSizes(roots) {
        const actives = [];
        (function walk(ns) {
            for (const n of ns) {
                if (n.active) actives.push(n);
                walk(n.children);
            }
        })(roots);
        actives.sort((a, b) => b.updated - a.updated);
        const m = new Map();
        actives.forEach((n, i) => m.set(n.id, i === 0 ? 'xl' : i === 1 ? 'lg' : ''));
        return m;
    }

    function ecgPoints(beats, now, o) {
        o = o || {};
        const w = o.w || 34, h = o.h || 20, win = o.win || 15 * 60 * 1000;
        const mid = h / 2, amp = h * 0.45, lo = now - win;
        const ts = (beats || []).filter(t => t >= lo && t <= now).sort((a, b) => a - b);
        const x = t => Math.max(0, Math.min(w, (t - lo) / win * w));
        // No leading flatline from the past: the trace begins at the first beat.
        const pts = [];
        for (const t of ts) {
            const cx = x(t);
            pts.push([Math.max(0, cx - 4), mid]);        // baseline before spike
            pts.push([Math.max(0, cx - 1.5), mid + h * 0.1]);  // Q dip
            pts.push([Math.max(0, cx), mid - amp]);      // R peak
            pts.push([Math.min(w, cx + 1.5), mid + h * 0.15]); // S dip
            pts.push([Math.min(w, cx + 4), mid]);        // back to baseline
        }
        if (!pts.length) return '';
        pts.push([w, mid]);
        return pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
    }

    function callDeltaAt(calls, i) {
        return i ? calls[i].ctx - calls[i - 1].ctx : calls[i].ctx;
    }

    function callRowMatches(r, f) {
        if (f.text && !(r.text || '').toLowerCase().includes(f.text.toLowerCase())) return false;
        return inRange(r.n, f.numMin, f.numMax)
            && inRange(r.ctx, f.ctxMin, f.ctxMax)
            && inRange(r.delta, f.deltaMin, f.deltaMax)
            && inRange(r.out, f.outMin, f.outMax)
            && inRange(r.reason, f.reasonMin, f.reasonMax)
            && inRange(r.in, f.inMin, f.inMax)
            && inRange(r.cr, f.crMin, f.crMax);
    }

    function visibleCallRows(calls, f, textOf) {
        textOf = textOf || (c => c.time ? String(c.time) : '');
        return calls.map((c, i) => ({
            n: i + 1, mid: c.mid, time: c.time, ctx: c.ctx, delta: callDeltaAt(calls, i),
            out: c.out, reason: c.reason, in: c.in, cr: c.cr, cw: c.cw || 0, text: textOf(c), hu: c.hu || '',
        })).filter(r => callRowMatches(r, f));
    }

    // opencode titles subagent sessions "Task (@general subagent)"; the agent
    // badge already says that, so the suffix is dropped when it names the same agent.
    function displayTitle(title, agent) {
        const t = String(title ?? '');
        if (!agent) return t;
        const m = /\s*\(@([\w.-]+) subagent\)\s*$/.exec(t);
        return m && m[1] === agent && m.index > 0 ? t.slice(0, m.index) : t;
    }

    function callFilterCount(f) {
        const set = (a, b) => a != null || b != null;
        return [
            !!f.text, set(f.numMin, f.numMax), set(f.ctxMin, f.ctxMax), set(f.deltaMin, f.deltaMax),
            set(f.outMin, f.outMax), set(f.reasonMin, f.reasonMax), set(f.inMin, f.inMax), set(f.crMin, f.crMax)
        ].filter(Boolean).length;
    }

    function parseHashSel(hash) {
        const m = /(?:^#|&)session=([^&]*)/.exec(hash || '');
        if (!m || !m[1]) return null;
        try { return decodeURIComponent(m[1]); } catch (e) { return null; }
    }

    if (typeof module !== 'undefined' && module.exports) module.exports = {
        modelName, nodeProvider, inRange, hmsToMs, presetRange, dateStrToRange, resolveDateBounds,
        treeMatchesNode, treeVisible, hotLevel, treeHotVisible, treeActiveVisible, treeCheckedVisible, nodeDir, heartSizes, ecgPoints,
        callDeltaAt, callRowMatches, visibleCallRows, displayTitle, treeFilterCount, callFilterCount, parseHashSel,
        COST_DEF, COST, MCOST, costOf, costT, costNode, tokEqOf, resetCost
    };
    // FILTER-LOGIC-END

    const COST_FIELDS = ['in', 'out', 'reason', 'cw', 'cr'];
    const costKey = k => 'cost.' + k;
    const pricesTip = () => COST_FIELDS.map(k => `${tr(costKey(k))}: $${COST[k].price}/1M${COST[k].on ? '' : ' ✕'}`).join(' · ');

    const newTreeFilter = () => ({
        text: '', models: new Set(), providers: new Set(), dirs: new Set(),
        numMin: null, numMax: null,
        datePreset: null, dateFrom: null, dateTo: null, dateMin: null, dateMax: null,
        ctxMin: null, ctxMax: null, spentMin: null, spentMax: null, durMin: null, durMax: null
    });
    const newCallFilter = () => ({
        text: '', numMin: null, numMax: null, ctxMin: null, ctxMax: null, deltaMin: null, deltaMax: null,
        outMin: null, outMax: null, reasonMin: null, reasonMax: null, inMin: null, inMax: null, crMin: null, crMax: null
    });
    let treeFilter = newTreeFilter(), callFilter = newCallFilter();
    let HOT = { warn: 100, crit: 120, apply: false };
    let REC = { only: false };
    let CHK = { only: false, marked: new Set() };

    const SET_KEY = 'ttree-settings';

    function saveSettings() {
        if (typeof localStorage === 'undefined') return;
        try {
            const tree = Object.assign({}, treeFilter, {
                models: [...treeFilter.models], providers: [...treeFilter.providers], dirs: [...treeFilter.dirs]
            });
            localStorage.setItem(SET_KEY, JSON.stringify({v: 2, tree, call: callFilter, hot: HOT, rec: REC,
                chk: {only: CHK.only, marked: [...CHK.marked]}, cost: COST, mcost: MCOST}));
        } catch (e) { /* storage unavailable — ignore */ }
    }

    function mergeCost(saved) {
        const c = JSON.parse(JSON.stringify(COST_DEF));
        for (const k of COST_FIELDS) {
            const f = saved && saved[k];
            if (f && typeof f.on === 'boolean' && typeof f.price === 'number' && Number.isFinite(f.price)) {
                c[k] = {on: f.on, price: f.price};
            }
        }
        return c;
    }

    function mergeMCost(saved) {
        const out = {};
        if (!saved || typeof saved !== 'object') return out;
        for (const m of Object.keys(saved)) {
            const f = saved[m];
            if (!f || typeof f !== 'object') continue;
            const clean = {};
            for (const k of COST_FIELDS) {
                if (typeof f[k] === 'number' && Number.isFinite(f[k])) clean[k] = f[k];
            }
            if (Object.keys(clean).length) out[m] = clean;
        }
        return out;
    }

    function loadSettings() {
        if (typeof localStorage === 'undefined') return;
        let s;
        try { s = JSON.parse(localStorage.getItem(SET_KEY)); } catch (e) { return; }
        if (!s || (s.v !== 1 && s.v !== 2)) return;
        try {
            if (s.tree) treeFilter = Object.assign(newTreeFilter(), s.tree,
                {models: new Set(s.tree.models || []), providers: new Set(s.tree.providers || []), dirs: new Set(s.tree.dirs || [])});
            if (s.call) callFilter = Object.assign(newCallFilter(), s.call);
            if (s.hot) HOT = Object.assign({warn: 100, crit: 120, apply: false}, s.hot);
            if (s.rec) REC = Object.assign({only: false}, s.rec);
            if (s.chk) CHK = Object.assign({only: false, marked: new Set(s.chk.marked || [])}, {only: !!s.chk.only});
            if (s.cost) Object.assign(COST, mergeCost(s.cost));
            MCOST = mergeMCost(s.mcost);
            document.querySelector('#hlwarn').value = HOT.warn ?? '';
            document.querySelector('#hlcrit').value = HOT.crit ?? '';
            document.querySelector('#hlapply').checked = !!HOT.apply;
            document.querySelector('#reconly').checked = !!REC.only;
            document.querySelector('#chkonly').checked = !!CHK.only;
        } catch (e) { /* corrupt — keep defaults */ }
    }

            return null;
        };
        const s = find(TREE);
        if (!s) return;
        (function walk(n) {
            if (on) CHK.marked.add(n.id); else CHK.marked.delete(n.id);
            n.children.forEach(walk);
        })(s);
        render();
        saveSettings();
    }

    function syncGearFormula() {

    // Aggregates per-model token totals across the whole tree from bymodel maps.
    function modelTotals() {
        const totals = new Map();
        (function walk(ns) {
            for (const n of ns) {
                if (n.bymodel) for (const m of Object.keys(n.bymodel)) {
                    const t = n.bymodel[m];
                    let a = totals.get(m);
                    if (!a) { a = {in: 0, out: 0, reason: 0, cw: 0, cr: 0}; totals.set(m, a); }
                    a.in += t.in || 0; a.out += t.out || 0; a.reason += t.reason || 0;
                    a.cw += t.cw || 0; a.cr += t.cr || 0;
                }
                walk(n.children);
            }
        })(TREE);
        return totals;
    }

    function buildGearModels() {
        const wrap = document.querySelector('#gearmodels');
        const totals = modelTotals();
        const models = [...totals.keys()].sort();
        if (!models.length) { wrap.innerHTML = `<div class="mtot">${tr('gear.models.none')}</div>`; return; }
        wrap.innerHTML = models.map(m => {
            const t = totals.get(m);
            const fields = COST_FIELDS.filter(k => t[k] > 0);
            const rows = fields.map(k => {
                const ov = MCOST[m] && MCOST[m][k] != null ? MCOST[m][k] : COST[k].price;
                return `<span class="mrow2"><label for="mp-${esc(m)}-${k}" title="${esc(tr(costKey(k)))}">${esc(tr(costKey(k)))}</label><span class="cur">$</span><input type="number" step="0.01" min="0" data-m="${esc(m)}" data-k="${k}" id="mp-${esc(m)}-${k}" value="${ov}" title="$/1M"></span>`;
            }).join('');
            return `<div class="mcard"><span class="mname" title="${esc(m)}">${esc(m)}</span>${rows}<span class="mtot">${tr('gear.models.tok', {n: fmt(t.in + t.out + t.reason + t.cw + t.cr)})}</span></div>`;
        }).join('');
    }

    function openTreeFilter() {

    function maxDepth(ns) {
        let d = 0;
        for (const x of ns) d = Math.max(d, 1 + maxDepth(x.children));
        return d
    }

    function setSort(k) {
        if (sortKey !== k) {
            sortKey = k;
            sortAsc = false;
        } else if (!sortAsc) {
            sortAsc = true;
        } else {
            sortKey = null;
            sortAsc = false;
        }
        render();
    }

    function sortVal(s) {
        return sortKey === 'dur' ? s.dur : sortKey === 'ctx' ? (s.maxctx || 0)
            : sortKey === 'time' ? (s.created || 0)
            : sortKey === 'money' ? costNode(s)
            : tokEqOf(s.subtree);
    }

    function sorted(ns) {
        return sortKey ? [...ns].sort((a, b) => sortAsc ? sortVal(a) - sortVal(b) : sortVal(b) - sortVal(a)) : ns;
    }

    // Shared timeline anchor: one Date.now() per render pass so every EKG row
    // maps beat timestamps onto the identical time axis — spikes line up
    // vertically across sessions, making start order obvious.
    let NOW = 0;

    function render() {
        NOW = Date.now();
        let h = '';
        const roots = sorted(TREE.filter(s => matches(s)
            && (!hotFilterActive() || treeHotVisible(s, HOT.warn, HOT.crit))
            && (!REC.only || treeActiveVisible(s))
            && (!CHK.only || treeCheckedVisible(s, CHK.marked))));
        const HEARTS = heartSizes(roots);
        let mc = 0, mt = 0, mm = 0;
        (function scan(ns) {
            for (const x of ns) {
                if (x.maxctx > mc) mc = x.maxctx;
                const te = tokEqOf(x.subtree), mo = costNode(x);
                if (te > mt) mt = te;
                if (mo > mm) mm = mo;
                scan(x.children);
            }
        })(roots);
        VMAX = {ctx: mc, tok: mt, money: mm};
        const th = (k, lbl, tip) => `<span class="val${k === 'time' ? ' v-idx' : k === 'ctx' ? ' v-ctx' : k === 'tok' ? ' v-tok' : k === 'money' ? ' v-money' : ''} th${sortKey === k ? ' active' + (sortAsc ? ' asc' : '') : ''}" title="${tip}" onclick="setSort('${k}')"><span class="thl">${lbl}</span></span>`;
        const thc = (cls, lbl, tip) => `<span class="thc ${cls}" title="${esc(tip)}">${lbl}</span>`;
        h += `<div class="thead"><span class="chkcol"></span>${thc('hcol', tr('tree.th.ekg'), tr('tree.th.ekg.tip'))}<span class="hlead"></span>${th('time', tr('tree.th.time'), tr('tree.th.time.tip'))}${thc('grow', tr('tree.th.session'), tr('tree.th.session.tip'))}${thc('', tr('tree.th.agent'), tr('tree.th.agent.tip'))}${thc('', tr('tree.th.model'), tr('tree.th.model.tip'))}<span class="vals">${th('dur', tr('tree.th.dur'), tr('tree.th.dur.tip'))}<span class="hsp"></span>${th('ctx', tr('tree.th.ctx'), tr('tree.th.ctx.tip'))}<span class="hsp"></span>${th('tok', tr('tree.th.spent'), tr('tree.th.spent.tip'))}<span class="hsp"></span>${th('money', tr('tree.th.money'), tr('tree.th.money.tip'))}</span></div>`;
        let groups = 0;
        SHOWN = {roots: 0, total: TREE.length};
        for (const [dirName, sessions] of docmap(roots)) {
            const vis = sessions.filter(matches);
            if (!vis.length) continue;
            groups++;
            SHOWN.roots += vis.length;
            const tot = vis.reduce((a, s) => {
                return {tok: a.tok + tokEqOf(s.subtree), money: a.money + costNode(s)}
            }, {tok: 0, money: 0});
            h += `<div class="project">${dirName} — ${tr('tree.sessions', {n: vis.length})} · ${tr('tree.project.spent', {spent: fmt(tot.tok), money: fmtMoney(tot.money)})}</div><ul>`;
            for (const s of vis) h += node(s, 1, HEARTS);
            h += '</ul>';
        }
        if (!groups) h += `<div class="empty">${tr('tree.empty')}</div>`;
        document.querySelector('#tree').innerHTML = h;
        updateFilterCount();
        syncGearStats();
    }

    function syncGearStats() {
        const el = document.querySelector('#statrows');
        if (!el) return;
        const allTok = TREE.reduce((a, s) => a + tokEqOf(s.subtree), 0);
        const allMoney = TREE.reduce((a, s) => a + costNode(s), 0);
        el.textContent = tr('stats.rows', {n: TREE.length, spent: fmt(allTok), money: fmtMoney(allMoney)});
    }

    const DEFAULT_AGENT = 'build';

    function node(s, depth, HEARTS) {
        const t = s.subtree;
        const kids = sorted(s.children).filter(k =>
            (!hotFilterActive() || treeHotVisible(k, HOT.warn, HOT.crit))
            && (!REC.only || treeActiveVisible(k))
            && (!CHK.only || treeCheckedVisible(k, CHK.marked)));
        const hasSub = kids.length > 0;
        const spent = tokEqOf(t);
        const money = costNode(s);
        const ctxPct = VMAX.ctx && s.maxctx ? Math.max(2, s.maxctx / VMAX.ctx * 100) : 0;
        const tokPct = VMAX.tok && spent ? Math.max(2, spent / VMAX.tok * 100) : 0;
        const monPct = VMAX.money && money ? Math.max(2, money / VMAX.money * 100) : 0;
        const spentTip = tr('node.spent.tip') + ' · ' + pricesTip();
        const moneyTip = tr('node.money.tip') + ' · ' + pricesTip();
        const subBadges = hasSub ? `<span class="badge sub">${tr('node.children_badge', {n: kids.length})}</span>` : '';
        const open = COLLAPSED.has(s.id) ? false : EXPANDED.has(s.id) ? true : (depth < 2 || hasSub && kids.length <= 6);
        const caret = hasSub ? `<span class="caret" onclick="toggle(event)">${open ? '−' : '+'}</span>` : `<span class="caret" style="visibility:hidden">·</span>`;
        const heartNow = NOW || Date.now();
        const heart = s.active
            ? `<svg class="ecg${HEARTS.get(s.id) ? ' ' + HEARTS.get(s.id) : ''}" viewBox="0 0 34 20" title="${esc(tr('node.active.tip'))} · ${esc(tr('node.active.updated', {ago: dur(heartNow - s.updated)}))}"><polyline points="${ecgPoints(s.beats, heartNow)}"/></svg>`
            : '<span class="hcol"></span>';
        const hl = hotLevel(s.maxctx, HOT.warn, HOT.crit);
            const agentBadge = s.agent && s.agent === DEFAULT_AGENT ? '' : `<span class="badge agent">${esc(s.agent || '—')}</span>`;
        let h = `<li><div class="node${depth === 1 ? ' root' : ''}${hl ? ' ' + hl : ''}${sel === s.id ? ' sel' : ''}" data-id="${s.id}">
    <input type="checkbox" class="mark" data-id="${esc(s.id)}"${CHK.marked.has(s.id) ? ' checked' : ''} onclick="chkToggle(event)" title="${esc(tr('checkmark.only.title'))}">
    ${heart}
    ${caret}
    <span class="val v-idx" title="${when(s.created)}">${ORDER.get(s.id) || '·'}</span>
    <span class="ttl" title="${esc(s.title)}">${esc(agentBadge ? displayTitle(s.title, s.agent) : s.title)}</span>
    ${agentBadge}${subBadges}
    <span class="badge">${esc(modelName(s.model))}</span>
    <span class="vals"><span class="val v-dur" title="${tr('node.dur.tip')}">${dur(s.dur)}</span><span class="vbar" title="${tr('node.ctx.tip')}"><span style="width:${s.maxctx ? ctxPct : 0}%"></span></span><span class="val v-ctx" title="${tr('node.ctx.tip')}">${s.maxctx ? `<span class="ctxsize">${fmt(s.maxctx)}</span>` : '—'}</span><span class="vbar amber" title="${spentTip}"><span style="width:${spent ? tokPct : 0}%"></span></span><span class="val v-tok" title="${spentTip}"><b>${fmt(spent)}</b></span><span class="vbar green" title="${moneyTip}"><span style="width:${money ? monPct : 0}%"></span></span><span class="val v-money" title="${moneyTip}"><b>${fmtMoney(money)}</b></span></span></div>`;
        if (hasSub) h += `<ul style="display:${open ? '' : 'none'}">${kids.map(k => node(k, depth + 1, HEARTS)).join('')}</ul>`;
        return h + '</li>';
    }

    function docmap(list) {
        const g = new Map();
        for (const s of list) {
            const k = s.dir || tr('tree.unknown_dir');
            if (!g.has(k)) g.set(k, []);
            g.get(k).push(s);
        }
        return [...g.entries()];
    }

    function toggle(e) {
        e.stopPropagation();
        const li = e.target.closest('li');
        const ul = li.querySelector(':scope > ul');
        if (!ul) return;
        ul.style.display = ul.style.display === 'none' ? '' : 'none';
        const id = li.querySelector('.node').dataset.id;
        if (ul.style.display === 'none') {
            COLLAPSED.add(id);
            EXPANDED.delete(id);
            e.target.textContent = '+';
        } else {
            EXPANDED.add(id);
            COLLAPSED.delete(id);
            e.target.textContent = '−';
        }
    }

    function esc(s) {
        return String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]))
    }

    const HUM_IC = {text: 'hum-text', question: 'hum-question', approval: 'hum-approval', image: 'hum-image'};

    function humIcon(kind) {
        return `<svg class="human-ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><use href="#${HUM_IC[kind] || 'hum-text'}"/></svg>`;
    }

    function humTip(kind) {
        switch (kind) {
            case 'question': return tr('calls.hum.question.tip');
            case 'approval': return tr('calls.hum.approval.tip');
            case 'image': return tr('calls.hum.image.tip');
            default: return tr('calls.hum.text.tip');
        }
    }

    function callsTable(calls) {
        if (!calls.length) {
            VISIBLE = [];
            return `<div class="empty">${tr('calls.empty')}</div>`;
        }
        const vis = visibleCallRows(calls, callFilter, c => when(c.time));
        VISIBLE = vis.map(r => r.n - 1);
        if (!vis.length) return `<div class="empty">${tr('calls.empty_filtered')}</div>`;
        const all = calls.map((c, i) => ({
            n: i + 1, ctx: c.ctx, delta: callDeltaAt(calls, i),
            out: c.out, reason: c.reason, in: c.in, cr: c.cr, cw: c.cw || 0
        }));
        vis.forEach(r => {
            r.tokeq = tokEqOf(r);
            r.money = costT(r, r.model);
        });
        const mx = k => vis.reduce((m, r) => Math.max(m, r[k]), 1);
        const mCtx = mx('ctx'), mD = Math.max(1, ...vis.map(r => r.delta)),
            mOut = mx('out'), mRn = mx('reason'), mIn = mx('in'), mCr = mx('cr'), mTq = mx('tokeq'), mMon = mx('money');
        const bar = (v, m, cls) => `<span class="vbar${cls ? ' ' + cls : ''}"><span style="width:${v > 0 ? Math.max(2, v / m * 100) : 0}%"></span></span>`;
        let rows = '';
        vis.forEach(r => {
            const cls = r.hu ? 'hum' : hotLevel(r.ctx, HOT.warn, HOT.crit);
            rows += `<tr${cls ? ` class="${cls}"` : ''}${r.hu ? ` title="${humTip(r.hu)}"` : ''} onclick="callPick('${esc(r.mid)}')">
  <td class="num">${r.hu ? humIcon(r.hu) : ''}${r.n}</td>
  <td class="num">${bar(r.ctx, mCtx)}<b class="ctxsize">${fmt(r.ctx)}</b></td>
  <td class="num">${bar(r.delta, mD)}${fmt(r.delta)}</td>
  <td class="num">${bar(r.out, mOut)}${fmt(r.out)}</td>
  <td class="num">${bar(r.reason, mRn)}${fmt(r.reason)}</td>
  <td class="num sep">${bar(r.in, mIn)}${fmt(r.in)}</td>
  <td class="num">${bar(r.cr, mCr)}${fmt(r.cr)}</td>
  <td class="num sep">${bar(r.tokeq, mTq, 'amber')}${fmt(r.tokeq)}</td>
  <td class="num">${bar(r.money, mMon, 'green')}${fmtMoney(r.money)}</td></tr>`;
        });
        const heads = [
            [tr('calls.th.num'), tr('calls.th.num.tip'), ''],
            [tr('calls.th.ctx'), tr('calls.th.ctx.tip'), ''],
            [tr('calls.th.delta'), tr('calls.th.delta.tip'), ''],
            [tr('calls.th.out'), tr('calls.th.out.tip'), ''],
            [tr('calls.th.reason'), tr('calls.th.reason.tip'), ''],
            [tr('calls.th.in'), tr('calls.th.in.tip'), 'sep'],
            [tr('calls.th.cr'), tr('calls.th.cr.tip'), ''],
            [tr('calls.th.tokeq'), tr('calls.th.tokeq.tip'), 'sep'],
            [tr('calls.th.money'), tr('calls.th.money.tip'), '']
        ];
        return `<table class="calls"><thead><tr>${heads.map(h => `<th${h[2] ? ` class="${h[2]}"` : ''} title="${h[1]}">${h[0]}</th>`).join('')}</tr></thead>
  <tbody>${rows}</tbody>
</table>`;
    }

    let curCall = -1;

    function modalClose() {
        curCall = -1;
        document.querySelector('#modal').hidden = true;
    }

    function callPick(mid) {
        const i = CALLS.findIndex(x => x.mid === mid);
        if (i >= 0) return showCall(i);
    }

    function callNav(d) {
        if (!VISIBLE.length) return;
        let p = VISIBLE.indexOf(curCall);
        if (p < 0) return showCall(d > 0 ? VISIBLE[0] : VISIBLE[VISIBLE.length - 1]);
        const np = p + d;
        if (np < 0 || np >= VISIBLE.length) return;
        return showCall(VISIBLE[np]);
    }

    function updateNav() {
        const p = VISIBLE.indexOf(curCall);
        document.querySelector('#cnav-prev').classList.toggle('disabled', p === 0 || !VISIBLE.length);
        document.querySelector('#cnav-next').classList.toggle('disabled', p === VISIBLE.length - 1 || !VISIBLE.length);
    }

    async function showCall(idx) {
        const c = CALLS[idx];
        if (!c) return;
        curCall = idx;
        const now = CALLS[CALLS.length - 1];
        const prev = CALLS[idx - 1];
        const d = prev ? c.ctx - prev.ctx : c.ctx;
        document.querySelector('#modal').hidden = false;
        document.querySelector('#modal-head').innerHTML = `<span>${tr('call.head', {n: c.n, total: CALLS.length, now: fmt(now.ctx), req: fmt(c.ctx), delta: fmt(d), fresh: fmt(c.in), out: fmt(c.out)})}</span><button id="modal-close" onclick="modalClose()">✕</button>`;
        updateNav();
        const body = document.querySelector('#modal-body');
        body.innerHTML = tr('loading');
        try {
            const r = await fetch('/api/trigger/' + encodeURIComponent(c.mid));
            if (!r.ok) throw new Error('HTTP ' + r.status);
            const j = await r.json();
            if (curCall !== idx) return;
            renderTrigger(j);
        } catch (e) {
            if (curCall === idx) body.innerHTML = `<div class="empty">${tr('load.fail', {msg: esc(e.message)})}</div>`;
        }
    }

    function renderTrigger(j) {
        const lbl = j.case === 'user' ? tr('trig.user')
            : j.case === 'assistant' ? tr('trig.assistant')
            : tr('trig.start');
        let h = `<div class="tblock"><div class="lbl">${lbl}</div></div>`;
        for (const p of (j.parts || [])) {
            if (p.kind === 'text') {
                h += `<div class="tblock"><div class="lbl">${tr('trig.text')}</div><pre class="prompt">${esc(p.text)}${p.cut ? '\n\n' + tr('trig.trunc') : ''}</pre></div>`;
            } else if (p.kind === 'tool') {
                h += `<div class="tblock"><div class="lbl">${tr('trig.tool', {tool: esc(p.tool), status: esc(p.status || '—')})}</div><pre class="prompt">${tr('trig.input')}
${esc(p.input)}${p.cut_i ? '\n' + tr('trig.trunc_in') : ''}${p.output ? `

${tr('trig.output')}
${esc(p.output)}${p.cut_o ? '\n' + tr('trig.trunc_out') : ''}` : ''}</pre></div>`;
            }
        }
        if (!(j.parts || []).length && j.case !== 'start') h += `<div class="empty">${tr('trig.empty')}</div>`;
        document.querySelector('#modal-body').innerHTML = h;
    }

    window.addEventListener('keydown', e => {
        if (!document.querySelector('#fmodal').hidden) {
            if (e.key === 'Escape') fmodalClose();
            return;
        }
        if (e.key === 'Escape' && !document.querySelector('#gearmenu').hidden) {
            document.querySelector('#gearmenu').hidden = true;
            return;
        }
        if (document.querySelector('#modal').hidden) return treeKey(e);
        if (e.key === 'Escape') modalClose();
        else if (e.key === 'ArrowLeft') callNav(-1);
        else if (e.key === 'ArrowRight') callNav(1);
    });

    async function getJson(u, errEl) {
        try {
            const r = await fetch(u);
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return await r.json();
        } catch (e) {
            if (errEl) errEl.innerHTML = tr('load.fail', {msg: esc(e.message)});
            return null;
        }
    }

    async function pick(id) {
        sel = id;
        const s = find(TREE, id);
        if (!s) return;
        document.querySelector('#detail').innerHTML = `<h2 id="dtitle" title="${esc(s.title)}">${esc(s.title)}</h2>
  <div class="sect">${tr('detail.calls')} <button class="fbtn" id="call-fbtn" onclick="openCallFilter()" title="${tr('filter.calls.btn.title')}">${tr('filter.btn')}</button></div><div id="calls">${tr('loading')}</div>
  <div class="sect">${tr('detail.prompt')}</div><pre class="prompt" id="pp">${tr('loading')}</pre>`;
        await fillDetail(id);
    }

    async function refreshDetail() {
        const id = sel;
        if (!id) return;
        const s = find(TREE, id);
        if (!s) return;
        const h2 = document.querySelector('#dtitle');
        if (h2) {
            h2.textContent = s.title;
            h2.title = s.title;
        }
        await fillDetail(id);
    }

    async function fillDetail(id) {
        const pP = getJson('/api/prompt/' + encodeURIComponent(id), document.querySelector('#pp'));
        const pC = getJson('/api/calls/' + encodeURIComponent(id), document.querySelector('#calls'));
        const pj = await pP;
        const cj = await pC;
        if (sel !== id) return;
        if (pj) {
            const pp = document.querySelector('#pp');
            pp.textContent = (pj.texts && pj.texts.length) ? pj.texts.join('\n\n—\n\n') : tr('prompt.empty');
        }
        if (cj) {
            CALLS = (cj.calls || []).map((c, i) => Object.assign({}, c, {n: i + 1}));
            document.querySelector('#calls').innerHTML = callsTable(CALLS);
        }
        updateFilterBtns();
    }

    function find(ns, id) {
        for (const x of ns) {
            if (x.id === id) return x;
            const r = find(x.children, id);
            if (r) return r
        }
        return null
    }

    function markSel(id) {
        document.querySelectorAll('#tree .node.sel').forEach(x => x.classList.remove('sel'));
        const nd = document.querySelector(`#tree .node[data-id="${CSS.escape(id)}"]`);
        if (nd) nd.classList.add('sel');
        return nd;
    }

    function syncUrl(id, push) {
        if (typeof location === 'undefined' || typeof history === 'undefined') return;
        const h = id ? '#session=' + encodeURIComponent(id) : '';
        if (location.hash === h || (!h && !location.hash)) return;
        const url = location.pathname + location.search + h;
        if (push) history.pushState(null, '', url); else history.replaceState(null, '', url);
    }

    // expand every collapsed ancestor so the selected row is reachable in the tree
    function revealPath(id) {
        const path = [];
        (function walk(ns) {
            for (const x of ns) {
                if (x.id === id) return true;
                path.push(x.id);
                if (walk(x.children)) return true;
                path.pop();
            }
            return false;
        })(TREE);
        let changed = false;
        for (const a of path) {
            if (!EXPANDED.has(a)) changed = true;
            COLLAPSED.delete(a);
            EXPANDED.add(a);
        }
        if (changed) render();
    }

    function selectSession(id, o) {
        o = o || {};
        if (!find(TREE, id)) return false;
        if (o.reveal) revealPath(id);
        const nd = markSel(id);
        if (nd && o.scroll) nd.scrollIntoView({block: 'nearest'});
        syncUrl(id, !!o.push);
        if (sel !== id) {
            clearTimeout(selectSession.t);
            if (o.delay) {
                sel = id;
                selectSession.t = setTimeout(() => sel === id && pick(id), o.delay);
            } else pick(id);
        }
        return true;
    }

    function applyHashSel() {
        if (typeof location === 'undefined') return;
        const id = parseHashSel(location.hash);
        if (!id && sel) {
            clearTimeout(selectSession.t);
            sel = null;
            CALLS = [];
            markSel('');
            document.querySelector('#detail').innerHTML = `<div class="empty" id="detailempty">${tr('detail.select')}</div>`;
            return;
        }
        if (id && id !== sel) selectSession(id, {reveal: true, scroll: true});
    }

    window.addEventListener('popstate', applyHashSel);

    function visibleNodes() {
        return [...document.querySelectorAll('#tree .node')].filter(n => n.offsetParent !== null);
    }

    function treeKey(e) {
        if (e.ctrlKey || e.metaKey || e.altKey) return;
        const tag = (e.target && e.target.tagName) || '';
        if (/^(INPUT|SELECT|TEXTAREA)$/.test(tag) || (e.target && e.target.isContentEditable)) return;
        if (tag === 'BUTTON' && e.key === 'Enter') return;
        if (!['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter', 'Home', 'End'].includes(e.key)) return;
        const nodes = visibleNodes();
        if (!nodes.length) return;
        e.preventDefault();
        const cur = nodes.findIndex(n => n.dataset.id === sel);
        const go = i => selectSession(nodes[Math.max(0, Math.min(nodes.length - 1, i))].dataset.id, {scroll: true, delay: 150});
        if (e.key === 'ArrowDown') return go(cur < 0 ? 0 : cur + 1);
        if (e.key === 'ArrowUp') return go(cur < 0 ? 0 : cur - 1);
        if (e.key === 'Home') return go(0);
        if (e.key === 'End') return go(nodes.length - 1);
        if (cur < 0) return;
        const nd = nodes[cur], caret = nd.querySelector('.caret');
        const ul = nd.parentElement.querySelector(':scope > ul');
        const open = ul && ul.style.display !== 'none';
        if (e.key === 'Enter') {
            if (ul) caret.click();
        } else if (e.key === 'ArrowRight') {
            if (ul && !open) caret.click();
            else if (open) go(cur + 1);
        } else if (e.key === 'ArrowLeft') {
            if (open) caret.click();
            else {
                const up = nd.parentElement.parentElement.closest('li');
                if (up) selectSession(up.querySelector(':scope > .node').dataset.id, {scroll: true, delay: 150});
            }
        }
    }

    document.querySelector('#tree').addEventListener('click', e => {
        const nd = e.target.closest('.node');
        if (nd && !e.target.classList.contains('caret')) {
            if (nd.dataset.id === sel) return;
            selectSession(nd.dataset.id, {push: true});
        }
    });
    document.querySelector('#refresh').addEventListener('click', load);

    let refreshLeft = 5;

    function refreshLabel() {
        const b = document.querySelector('#refresh');
        const n = document.querySelector('#refnum');
        if (n) n.textContent = refreshLeft; else b.textContent = refreshLeft;
        b.title = tr('refresh.title', {n: refreshLeft});
    }

    function buildLangSwitcher() {
        const el = document.querySelector('#langsw');
        el.title = tr('lang.title');
        el.innerHTML = I18N.LANGS.map(l =>
            `<span data-lang="${l.code}"${I18N.curLang() === l.code ? ' class="on"' : ''}>${l.label}</span>`).join('');
        el.querySelectorAll('span').forEach(b => b.addEventListener('click', () => {
            if (I18N.curLang() !== b.dataset.lang) {
                I18N.setLang(b.dataset.lang);
                applyLang();
            }
        }));
    }

    function applyLangStatic() {
        document.documentElement.lang = I18N.curLang();
        document.title = tr('doc.title');
        const ps = document.querySelector('#provsel');
        if (ps) ps.title = tr('prov.tip');
        const fb = document.querySelector('#tree-fbtn');
        fb.title = tr('filter.btn.title');
        updateFilterBtns();
        document.querySelector('#fbymark').textContent = tr('filter.by');
        document.querySelector('#hlbox').title = tr('hl.title');
        document.querySelector('#hllabel').textContent = tr('filter.threshold');
        document.querySelector('#hlwarn').title = tr('hl.warn.title');
        document.querySelector('#hlcrit').title = tr('hl.crit.title');
        document.querySelector('#hlapply').title = tr('hl.apply.title');
        document.querySelector('#recbox').title = tr('recent.only.title');
        document.querySelector('#reconly').title = tr('recent.only.title');
        document.querySelector('#reclabel').title = tr('recent.only.title');
        document.querySelector('#reclabel').textContent = tr('filter.recent');
        document.querySelector('#chkbox').title = tr('checkmark.only.title');
        document.querySelector('#chkonly').title = tr('checkmark.only.title');
        document.querySelector('#chklabel').title = tr('checkmark.only.title');
        document.querySelector('#chklabel').textContent = tr('filter.checkmark');
        document.querySelector('#version').title = tr('version.title');
        document.querySelector('#gearbtn').title = tr('gear.title');
        document.querySelector('#gearstats').textContent = tr('gear.stats');
        syncGearStats();
        document.querySelector('#gearcost').textContent = tr('gear.cost');
        document.querySelector('#gearmodels-sect').textContent = tr('gear.models');
        document.querySelector('#gearmodels').title = tr('gear.models.tip');
        COST_FIELDS.forEach(k => document.querySelector('#lbl-' + k).textContent = tr(costKey(k)));
        COST_FIELDS.forEach(k => document.querySelector('#pr-' + k).title = tr('gear.price.ph'));
        document.querySelector('#gearreset').textContent = tr('gear.reset');
        document.querySelector('#gearformula').title = tr('gear.formula.tip');
        document.querySelector('#splitter').title = tr('splitter.title');
        const dbl = document.querySelector('#dblabel');
        if (dbl) dbl.textContent = tr('db.label');
        const dba = document.querySelector('#dbapply');
        if (dba) dba.textContent = tr('db.apply');
        const dbi = document.querySelector('#dbcustom');
        if (dbi) dbi.placeholder = tr('db.custom.placeholder');
        if (lastDbInfo) renderDbField(lastDbInfo);
        const de = document.querySelector('#detailempty');
        if (de) de.textContent = tr('detail.select');
        refreshLabel();
        buildLangSwitcher();
    }

    function applyLang() {
        applyLangStatic();
        render();
        if (sel) pick(sel);
        if (curCall >= 0) showCall(curCall);
        if (fmodalKind === 'tree') openTreeFilter();
        else if (fmodalKind === 'call') openCallFilter();
    }

    function refreshTick() {
        if (--refreshLeft <= 0) return load();
        refreshLabel();
    }

    async function load() {
        const sp = document.querySelector('#refresh');
        sp.classList.add('busy');
        refreshLeft = 5;
        refreshLabel();
        try {
            await syncProvider();
            const r = await fetch('/api/tree');
            const j = await r.json();
            if (j && j.error === 'db_not_found') {
                TREE = [];
                computeOrder();
                document.querySelector('#tree').innerHTML = `<div class="empty">${esc(tr('db.notfound'))}</div>`;
                syncGearStats();
                await refreshDbState();
                return;
            }
            TREE = j;
            computeOrder();
            render();
            refreshDetail();
            updateFilterBtns();
            if (!load.done) {
                load.done = true;
                applyHashSel();
            }
        } finally {
            sp.classList.remove('busy');
        }
    }

    const DB_STORE_KEY = 'db.path';
    let lastDbInfo = null;

    function lsGetDb() {
        if (typeof localStorage === 'undefined') return null;
        try { return localStorage.getItem(DB_STORE_KEY); } catch (e) { return null; }
    }

    function lsSetDb(v) {
        if (typeof localStorage === 'undefined') return;
        try {
            if (v === null) localStorage.removeItem(DB_STORE_KEY);
            else localStorage.setItem(DB_STORE_KEY, v);
        } catch (e) { }
    }

    async function fetchDbInfo() {
        try {
            const r = await fetch('/api/db');
            return r.ok ? await r.json() : null;
        } catch (e) { return null; }
    }

    const PROV_STORE_KEY = 'provider.name';

    function lsGetProv() {
        if (typeof localStorage === 'undefined') return null;
        try { return localStorage.getItem(PROV_STORE_KEY); } catch (e) { return null; }
    }

    function lsSetProv(v) {
        if (typeof localStorage === 'undefined') return;
        try {
            if (v === null) localStorage.removeItem(PROV_STORE_KEY);
            else localStorage.setItem(PROV_STORE_KEY, v);
        } catch (e) { }
    }

    async function fetchProvInfo() {
        try {
            const r = await fetch('/api/provider');
            return r.ok ? await r.json() : null;
        } catch (e) { return null; }
    }

    async function postProvider(name) {
        try {
            const r = await fetch('/api/provider', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name })
            });
            return await r.json();
        } catch (e) { return { ok: false, error: String(e) }; }
    }

    const provLabel = n => n === 'claude' ? tr('prov.claude') : n === 'copilot' ? tr('prov.copilot') : n;

    let lastProv = null;

    function renderProvField(info) {
        lastProv = info.provider;
        const sel = document.querySelector('#provsel');
        if (!sel) return;
        sel.innerHTML = (info.providers || []).map(p =>
            `<option value="${esc(p)}"${p === info.provider ? ' selected' : ''}>${esc(provLabel(p))}</option>`).join('');
        refreshDbState(); // picker visibility follows the new provider's `switchable`
    }

    // The provider lives on the server; anything can flip it back while the
    // page is open (a restart resets it to the startup default, another tab
    // may switch it). Each refresh keeps the dropdown truthful and re-applies
    // the remembered choice when the server drifted from it.
    async function syncProvider() {
        const info = await fetchProvInfo();
        if (!info) return;
        const stored = lsGetProv();
        if (stored && stored !== info.provider) {
            const res = await postProvider(stored);
            if (res.ok) {
                renderProvField(await fetchProvInfo() || info);
                return;
            }
            lsSetProv(null); // no longer switchable — drop the stored choice
        }
        if (info.provider !== lastProv) renderProvField(info);
    }

    async function applyProvider(name) {
        const res = await postProvider(name);
        if (res.ok) {
            lsSetProv(name);
            await refreshDbState();
            load();
        } else {
            const sel = document.querySelector('#provsel');
            if (sel) {
                sel.title = res.error || tr('prov.tip');
                const info = await fetchProvInfo();
                if (info) renderProvField(info);
            }
        }
    }

    async function initProvField() {
        const info = await fetchProvInfo();
        if (info) renderProvField(info);
        const sel = document.querySelector('#provsel');
        if (sel) sel.addEventListener('change', () => applyProvider(sel.value));
        // stored choice from a previous run: re-apply it; if the provider is
        // no longer switchable (e.g. its data vanished) drop the stored value
        const stored = lsGetProv();
        if (info && stored && stored !== info.provider) {
            const res = await postProvider(stored);
            if (res.ok) {
                const ni = await fetchProvInfo();
                if (ni) renderProvField(ni);
            } else {
                lsSetProv(null);
                sel.title = res.error || tr('prov.tip');
            }
        }
    }

    async function postDbPath(path) {
        try {
            const r = await fetch('/api/db', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ path })
            });
            return await r.json();
        } catch (e) { return { ok: false, error: String(e) }; }
    }

    function dbOptionsHtml(info) {
        const cands = info.candidates || [];
        const opts = [];
        if (info.path && !cands.includes(info.path))
            opts.push(`<option value="${esc(info.path)}" selected>${esc(info.path)}</option>`);
        for (const p of cands)
            opts.push(`<option value="${esc(p)}"${p === info.path ? ' selected' : ''}>${esc(p)}</option>`);
        opts.push(`<option value="__custom__">${esc(tr('db.custom'))}</option>`);
        return opts.join('');
    }

    function renderDbField(info) {
        lastDbInfo = info;
        const sel = document.querySelector('#dbsel');
        if (!sel) return;
        sel.innerHTML = dbOptionsHtml(info);
        sel.title = info.found
            ? tr('db.title')
            : tr('db.missing.tip') + (info.error ? ' — ' + info.error : '');
        const wrap = document.querySelector('#dbwrap');
        if (wrap) {
            wrap.hidden = !info.switchable;
            if (info.found) wrap.classList.remove('missing');
            else wrap.classList.add('missing');
        }
    }

    async function refreshDbState() {
        const info = await fetchDbInfo();
        if (info) renderDbField(info);
        return info;
    }

    function showDbCustom(show) {
        const inp = document.querySelector('#dbcustom'), btn = document.querySelector('#dbapply');
        if (inp) inp.hidden = !show;
        if (btn) btn.hidden = !show;
    }

    async function applyDbPath(path) {
        const res = await postDbPath(path);
        if (res.ok) {
            lsSetDb(path);
            showDbCustom(false);
            await refreshDbState();
            load();
        } else {
            const wrap = document.querySelector('#dbwrap'), sel = document.querySelector('#dbsel');
            if (wrap) wrap.classList.add('missing');
            if (sel) sel.title = res.error || tr('db.missing.tip');
        }
    }

    async function initDbField() {
        const info = await fetchDbInfo();
        if (info) renderDbField(info);
        const sel = document.querySelector('#dbsel');
        if (sel) sel.addEventListener('change', async () => {
            if (sel.value === '__custom__') { showDbCustom(true); return; }
            await applyDbPath(sel.value);
        });
        const btn = document.querySelector('#dbapply');
        if (btn) btn.addEventListener('click', async () => {
            const inp = document.querySelector('#dbcustom');
            const p = ((inp && inp.value) || '').trim();
            if (p) await applyDbPath(p);
        });
        // stored custom path from a previous run: re-apply it; if it no longer
        // validates, the server keeps its autodetected DB and we drop the value
        const stored = lsGetDb();
        if (info && stored && stored !== info.path) {
            const res = await postDbPath(stored);
            if (res.ok) { await refreshDbState(); load(); }
            else lsSetDb(null);
        }
    }

    loadSettings();
    applyLangStatic();
    initProvField().then(() => { initDbField(); load(); });
    setInterval(refreshTick, 1000);

    // draggable splitter between tree and details
    (() => {
        const sp = document.querySelector('#splitter'), main = document.querySelector('main'),
            detail = document.querySelector('#detail');
        let drag = false;
        sp.addEventListener('mousedown', e => {
            drag = true;
            sp.classList.add('active');
            document.body.style.userSelect = 'none';
            e.preventDefault()
        });
        window.addEventListener('mousemove', e => {
            if (!drag) return;
            const r = main.getBoundingClientRect();
            let pct = (r.right - e.clientX) / r.width * 100;
            pct = Math.max(20, Math.min(80, pct));
            detail.style.width = pct + '%';
            detail.style.minWidth = '0';
        });
        window.addEventListener('mouseup', () => {
            drag = false;
            sp.classList.remove('active');
            document.body.style.userSelect = ''
        });
        sp.addEventListener('dblclick', () => {
            detail.style.width = '44%'
        });
    })();
</script>
</body>
</html>
